<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verlif 的导航站</title>
  <link rel="stylesheet" href="assets/nav.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="page-wrapper">

    <!-- GitHub 个人信息区 -->
    <header class="profile-section">
      <a href="https://github.com/Verlif" target="_blank" class="avatar-link">
        <img src="https://avatars.githubusercontent.com/Verlif" alt="Verlif" class="avatar">
      </a>
      <h1 class="username">Verlif</h1>
      <p class="bio">你知道吗？蜡烛可以让影子动起来</p>

      <div class="github-stats">
        <a href="https://github.com/Verlif?tab=repositories" target="_blank" class="stat-item">
          <i class="fas fa-book"></i>
          <span>Repositories</span>
        </a>
        <a href="https://github.com/Verlif?tab=stars" target="_blank" class="stat-item">
          <i class="fas fa-star"></i>
          <span>Stars</span>
        </a>
        <a href="https://github.com/Verlif?tab=followers" target="_blank" class="stat-item">
          <i class="fas fa-users"></i>
          <span>Followers</span>
        </a>
      </div>
    </header>

    <!-- 搜索框 -->
    <div class="search-wrapper">
      <i class="fas fa-search search-icon"></i>
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="搜索页面..."
        autocomplete="off"
      >
      <span class="search-count" id="searchCount"></span>
    </div>

    <!-- 卡片网格 -->
    <main class="cards-grid" id="cardsGrid">
      {{links}}
    </main>

    <!-- 无结果提示 -->
    <div class="no-result" id="noResult" style="display:none;">
      <i class="fas fa-inbox"></i>
      <p>没有找到匹配的页面</p>
    </div>

  </div>

  <script>
    // 搜索过滤逻辑
    const searchInput = document.getElementById('searchInput');
    const cardsGrid = document.getElementById('cardsGrid');
    const noResult = document.getElementById('noResult');
    const searchCount = document.getElementById('searchCount');

    searchInput.addEventListener('input', function () {
      const keyword = this.value.trim().toLowerCase();
      const cards = cardsGrid.querySelectorAll('.card');
      let visibleCount = 0;

      cards.forEach(card => {
        const title = card.querySelector('.card-title').textContent.toLowerCase();
        const desc = card.querySelector('.card-desc')?.textContent.toLowerCase() || '';
        const match = title.includes(keyword) || desc.includes(keyword);

        if (match) {
          card.style.display = '';
          card.classList.remove('card-hidden');
          visibleCount++;
        } else {
          card.style.display = 'none';
          card.classList.add('card-hidden');
        }
      });

      noResult.style.display = visibleCount === 0 ? 'flex' : 'none';
      searchCount.textContent = keyword ? `找到 ${visibleCount} 个页面` : '';
    });
  </script>
</body>
</html>
