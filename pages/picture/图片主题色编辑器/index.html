<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片主题色替换</title>
<script>
/* 提前应用主题，避免首屏闪烁（键名与 assets/js/core/config.js 中 STORAGE_KEYS.theme 保持一致） */
(function () {
  try {
    var v = localStorage.getItem('ict.theme');
    if (v !== 'light' && v !== 'dark') {
      v = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', v);
  } catch (e) { /* 隐私模式下保持默认暗色 */ }
})();
</script>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

<div class="app">
  <!-- ============ 顶栏 ============ -->
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div class="brand-text">
        <h1 data-i18n="app.title">图片主题色替换</h1>
        <small data-i18n="app.subtitle">提取主色 · 单独换色 · 点击找色</small>
      </div>
    </div>

    <div class="top-actions">
      <!-- 语言切换 -->
      <div class="lang-switch" role="group" aria-label="语言" data-i18n-aria-label="lang.label">
        <button type="button" class="lang-btn" data-lang="zh-CN" aria-pressed="true">中文</button>
        <button type="button" class="lang-btn" data-lang="en-US" aria-pressed="false">EN</button>
      </div>

      <!-- 主题切换 -->
      <button type="button" class="icon-btn" id="themeToggle" title="切换到亮色主题" data-i18n-title="theme.toggleToLight">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2"></path><path d="M12 20v2"></path>
          <path d="M4.9 4.9l1.4 1.4"></path><path d="M17.7 17.7l1.4 1.4"></path>
          <path d="M2 12h2"></path><path d="M20 12h2"></path>
          <path d="M4.9 19.1l1.4-1.4"></path><path d="M17.7 6.3l1.4-1.4"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
        </svg>
      </button>

      <!-- 像素预览 -->
      <div class="top-switch" id="pixelRow" title="开启后放大查看时保持像素硬边，不做平滑模糊" data-i18n-title="action.pixelPreviewTip">
        <span class="ts-label" data-i18n="action.pixelPreview">像素预览</span>
        <button type="button" class="switch" id="pixelToggle" aria-pressed="true" title="像素预览" data-i18n-title="action.pixelPreview"></button>
      </div>

      <button type="button" class="btn ghost" id="reuploadBtn" data-i18n="action.reupload" style="display:none">更换图片</button>
      <button type="button" class="btn" id="downloadBtn" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="M7 11l5 5 5-5"></path><path d="M4 20h16"></path></svg>
        <span data-i18n="action.download">下载图片</span>
      </button>
    </div>
  </header>

  <!-- ============ 工作区 ============ -->
  <main class="workspace">

    <!-- 左：原图 -->
    <section class="pane">
      <div class="pane-head">
        <span data-i18n="pane.source">原图</span>
        <span id="srcSize" class="badge">—</span>
      </div>
      <div class="pane-body" id="srcBody">
        <div class="viewer"><canvas id="srcCanvas" style="display:none"></canvas></div>
        <button type="button" class="viewer-reset" title="重置视图" data-i18n-title="action.resetView">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
          <span data-i18n="action.fitWindow">适应窗口</span>
        </button>
        <span class="zoom-hint" data-i18n="zoomHint">滚轮缩放 · 拖拽移动 · 单击找色 · 双击重置</span>
      </div>
    </section>

    <!-- 中：主要颜色 -->
    <section class="pane pane-mid">
      <div class="pane-head">
        <span data-i18n="pane.colors">主要颜色</span>
        <span class="badge" id="colorCount">0</span>
      </div>

      <!-- 固定控制区 -->
      <div class="mid-controls">
        <div class="tol-box">
          <div class="tol-head">
            <span class="tol-label" data-i18n="tolerance.label">容差范围</span>
            <span class="tol-val" id="tolVal">10 <span class="den">/ 255</span></span>
          </div>
          <input type="range" id="tolRange" min="0" max="255" value="10" step="1" aria-label="容差范围" data-i18n-aria-label="tolerance.label">
          <p class="tol-tip" data-i18n-html="tolerance.tip">按 <b>RGB 单通道差值</b>计算，范围 0 – 255。0 = 仅精确匹配；数值越大，越多相近颜色会被一起替换。松开鼠标后更新颜色列表。</p>
        </div>

        <div class="switch-row" id="mergeRow">
          <span class="sr-text">
            <span class="sr-label" data-i18n="merge.label">合并相近颜色</span>
            <span class="sr-sub" data-i18n="merge.sub">把容差内相邻的主色合并为一组处理</span>
          </span>
          <button type="button" class="switch" id="mergeToggle" aria-pressed="false" title="合并相近颜色" data-i18n-title="merge.label"></button>
        </div>
      </div>

      <!-- 唯一滚动区：颜色列表 -->
      <div class="mid-list" id="midList">
        <div class="color-list" id="colorList"></div>
      </div>

      <!-- 固定底栏 -->
      <div class="mid-footer">
        <button type="button" class="btn ghost" id="resetAllBtn" data-i18n="action.resetAll" disabled>重置全部</button>
        <span class="ms"><span data-i18n="footer.elapsed">耗时</span> <b id="msVal">—</b></span>
      </div>
    </section>

    <!-- 右：预览 -->
    <section class="pane">
      <div class="pane-head">
        <span data-i18n="pane.preview">预览效果</span>
        <span class="dot-live" id="liveDot" style="display:none"></span>
      </div>
      <div class="pane-body" id="outBody">
        <div class="viewer"><canvas id="outCanvas" style="display:none"></canvas></div>
        <button type="button" class="viewer-reset" title="重置视图" data-i18n-title="action.resetView">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
          <span data-i18n="action.fitWindow">适应窗口</span>
        </button>
        <span class="zoom-hint" data-i18n="zoomHint">滚轮缩放 · 拖拽移动 · 单击找色 · 双击重置</span>
      </div>
    </section>

    <!-- 空状态 -->
    <div class="empty-state" id="emptyState">
      <label class="upload-box" id="uploadBox">
        <input type="file" id="fileInput" accept="image/*" hidden>
        <div class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 16V4"></path><path d="M8 8l4-4 4 4"></path>
            <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path>
          </svg>
        </div>
        <p data-i18n="upload.title">点击上传图片</p>
        <span data-i18n="upload.hint">或拖拽图片到此处 · 也支持 Ctrl/⌘ + V 粘贴</span>
      </label>
    </div>

  </main>
</div>

<!-- 经典脚本按依赖顺序加载（兼容 file:// 直开，不使用 ES Module） -->
<script src="assets/js/core/config.js"></script>
<script src="assets/js/core/utils.js"></script>
<script src="assets/locales/zh-CN.js"></script>
<script src="assets/locales/en-US.js"></script>
<script src="assets/js/core/i18n.js"></script>
<script src="assets/js/core/theme.js"></script>
<script src="assets/js/core/state.js"></script>
<script src="assets/js/features/viewer.js"></script>
<script src="assets/js/features/palette.js"></script>
<script src="assets/js/features/processor.js"></script>
<script src="assets/js/features/colorList.js"></script>
<script src="assets/js/features/uploader.js"></script>
<script src="assets/js/features/downloader.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
