<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f5f7f8">
  <title>地点距离绘制</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="app">
  <canvas id="map" role="application" aria-label="地点距离绘图画布"></canvas>
  <header class="topbar">
    <div class="brand"><div class="eyebrow">FIELD NOTES · MAP SKETCH</div><h1><input class="map-name-input" id="mapNameInput" type="text" maxlength="40" value="示例地图" aria-label="地图名称" title="编辑地图名称"></h1><div class="subtitle">在网格上放置地点，连接后自动标注直线距离。</div></div>
    <div class="top-controls">
      <label class="scale-box">每格距离 <input id="cellDistance" type="number" min="1" max="100000" step="10" value="100" aria-label="每格距离"><span>米</span></label>
      <div class="tool-switch" role="toolbar" aria-label="绘图工具">
        <button class="tool active" data-mode="place">＋ 放置</button><button class="tool" data-mode="connect">⌁ 连线</button><button class="tool" data-mode="preview">◉ 预览</button><button class="tool" data-mode="delete">− 删除</button>
      </div>
      <div class="zoom-box" aria-label="画布缩放"><button id="zoomOut" aria-label="缩小">−</button><span id="zoomLabel">100%</span><button id="zoomIn" aria-label="放大">+</button><button id="zoomReset" aria-label="重置视图">⌖</button></div>
      <button class="theme-toggle" id="themeToggle" aria-label="切换明暗主题" title="切换明暗主题">☾</button>
    </div>
  </header>
  <div class="tip" id="tip">点击空白网格放置地点 · 拖动画布平移 · 滚轮缩放</div>
  <div class="bottom">
    <div class="legend"><strong><span class="dot"></span>读图方式</strong><br>地点自动吸附至网格交点<br>距离按网格直线计算，可修改每格距离</div>
    <div class="stats"><b id="placeCount">0</b> 个地点　·　<b id="edgeCount">0</b> 条路线</div>
    <div class="actions"><button class="action" id="undo">↶ 撤回</button><button class="action" id="clear">清空</button><button class="action primary" id="sample">加载示例</button><button class="action" id="export">导出 JSON</button><button class="action" id="exportImage">🖼 导出图片</button><button class="action" id="import">导入 JSON</button></div>
  </div>
  <div class="floaters">
    <button id="centerMap" aria-label="回到地图中心" title="回到地图中心"><span>◎</span><small>居中</small></button>
    <button id="historyToggle" aria-expanded="false" aria-controls="historyPanel"><span>▤</span><small>加载历史</small></button>
  </div>
  <aside class="history-panel" id="historyPanel" aria-label="地图历史记录">
    <div class="history-panel-head"><strong>加载历史</strong><button class="action primary" id="newMap">＋ 新地图</button></div>
    <div class="history-list" id="historyList"></div>
  </aside>
  <div class="place-editor" id="placeEditor" role="dialog" aria-label="编辑地点">
    <div class="modal-head"><span>编辑地点</span><button class="close" id="closeEditor" aria-label="关闭">×</button></div>
    <div class="fields"><input id="placeIcon" maxlength="4" aria-label="地点图标" placeholder="📍"><input id="placeName" maxlength="16" aria-label="地点名称" placeholder="地点名称"></div>
    <div class="modal-actions"><button class="action" id="deletePlace">删除地点</button><button class="action" id="cancelEdit">取消</button><button class="action primary" id="savePlace">保存</button></div>
  </div>
  <dialog class="confirm-dialog" id="confirmDialog" aria-labelledby="confirmTitle" aria-describedby="confirmMessage">
    <form method="dialog">
      <h2 id="confirmTitle">确认操作</h2>
      <img class="confirm-preview" id="confirmPreview" alt="地图预览" hidden>
      <p id="confirmMessage"></p>
      <div class="confirm-actions"><button class="action" value="cancel">取消</button><button class="action primary" id="confirmAction" value="confirm">确定</button></div>
    </form>
  </dialog>
  <div class="drop-overlay" id="dropOverlay" aria-hidden="true"><div>松开以导入 JSON 地图</div></div>
  <div class="toast" id="toast" role="status"></div><input id="fileInput" type="file" accept="application/json,.json" hidden>
</div>
<script src="js/config.js"></script>
<script src="js/renderer.js"></script>
<script src="js/storage.js"></script>
<script src="js/export-image.js"></script>
<script src="js/theme.js"></script>
<script src="js/editor.js"></script>
<script src="js/main.js"></script>
</body>
</html>
