<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>回声躲猫猫 · Echo Hide & Seek</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    height:100%;
    background: #030508;
    display:flex; align-items:center; justify-content:center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color:#e8eefc; overflow:hidden; user-select:none;
  }
  #app {
    display: flex; flex-direction: column; gap: 10px;
    width: min(960px, 96vw, calc((96vh - 76px) * 1.6));
  }
  #hud { display: flex; gap: 8px; flex-wrap: wrap; font-size: clamp(11px, 1.2vw, 13px); flex-shrink: 0; }
  .hud-item {
    background: rgba(8,12,20,.85);
    border: 1px solid rgba(90,140,255,.2);
    border-radius: 10px;
    padding: 6px 12px;
    display:flex; gap:8px; align-items:center;
    white-space: nowrap;
  }
  .hud-item .label { color:#6d7d9e; font-size:.85em; }
  .hud-item span:last-child { font-weight:700; font-variant-numeric: tabular-nums; }
  #timeText.warn { color:#ff6b81; animation: pulse .8s infinite alternate; }
  @keyframes pulse { from{opacity:1} to{opacity:.45} }
  #spectatorBadge { display:none; background: rgba(40,14,20,.85); border-color: rgba(255,110,140,.4); color:#ffb0c0; }
  #spectatorBadge.show { display:flex; }

  #noiseMeter .bar {
    width: 72px; height: 9px;
    background: rgba(255,255,255,.08);
    border-radius: 5px; overflow: hidden; position: relative;
  }
  #noiseMeter .fill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #7fd3ff, #a98bff);
    border-radius: 5px; transition: width .06s linear;
  }
  #noiseMeter.ready .fill {
    background: linear-gradient(90deg, #7fffc4, #7fd3ff);
    box-shadow: 0 0 10px rgba(127,255,196,.8);
  }
  #noiseMeter.ready .label { color:#7fffc4; }

  #wrap { position:relative; width:100%; aspect-ratio: 960 / 600; flex-shrink: 0; }
  #cv {
    display:block; width:100%; height:100%;
    border-radius:16px; background:#000;
    box-shadow: 0 0 80px rgba(70,130,255,.10), 0 0 0 1px rgba(90,140,255,.08);
  }
  #toast {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(.9);
    padding:14px 30px; border-radius:14px;
    background: rgba(12,8,18,.92);
    border:1px solid rgba(130,180,255,.4);
    color:#aee0ff; font-size: clamp(16px,2.2vw,26px); font-weight:800;
    letter-spacing:2px; opacity:0; pointer-events:none;
    transition: opacity .35s, transform .35s;
    text-shadow: 0 0 24px rgba(120,200,255,.7);
    z-index:8;
  }
  #toast.show { opacity:1; transform:translate(-50%,-50%) scale(1); }

  /* 菜单 / 结算遮罩：半透明，让地图可见 */
  #overlay {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(3,5,10,.72);
    backdrop-filter: blur(3px);
    border-radius:16px; transition: opacity .35s; z-index:10;
  }
  #overlay.hidden { opacity:0; pointer-events:none; }
  /* 结算时使用更亮的透明背景 */
  #overlay.result { background: rgba(3,5,10,.55); backdrop-filter: blur(0px); }
  #overlay.result.minimized {
    background: transparent; backdrop-filter: none; pointer-events: none; align-items: flex-start; justify-content: flex-end;
  }
  #overlay.result.minimized #panel { display: none; }
  .result-min-btn {
    display:none; position:absolute; top:12px; right:12px; z-index:2;
    width:auto; min-width:120px; margin:0; padding:8px 12px;
    border-radius:10px; pointer-events:auto;
    background: rgba(10,16,28,.88); border:1px solid rgba(120,170,255,.35);
    color:#cfe0ff; font:700 12px/1.2 inherit; cursor:pointer;
    box-shadow:0 8px 26px rgba(0,0,0,.35);
  }
  #overlay.result .result-min-btn { display:block; }
  .result-min-btn:hover { background:rgba(24,38,64,.96); transform:translateY(-1px); }

  #pauseOverlay {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(3,5,10,.88);
    backdrop-filter: blur(12px); border-radius:16px;
    opacity:0; pointer-events:none; transition: opacity .22s; z-index:11;
  }
  #pauseOverlay.show { opacity:1; pointer-events:auto; }
  .pause-panel { text-align:center; min-width: 260px; }
  .pause-panel h2 {
    font-size: clamp(28px, 3.6vw, 44px);
    letter-spacing: 10px; font-weight: 900;
    background: linear-gradient(120deg,#7fd3ff,#a98bff);
    -webkit-background-clip: text; background-clip:text; color:transparent;
    margin-bottom: 8px;
  }
  .pause-panel .pause-hint { color:#8d9cbe; font-size: clamp(12px,1.4vw,14px); letter-spacing: 1px; margin-bottom: 22px; }
  .pause-panel kbd {
    display:inline-block; padding: 2px 9px; border-radius: 6px;
    background: rgba(60,90,140,.5);
    border: 1px solid rgba(120,170,255,.35);
    font-family: inherit; font-weight: 700; color:#c4dcff; margin: 0 3px;
  }

  /* 开局倒计时 */
  #countdownOverlay {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(3,5,10,.85);
    backdrop-filter: blur(8px);
    border-radius:16px;
    opacity:0; pointer-events:none;
    transition: opacity .3s; z-index:12;
  }
  #countdownOverlay.show { opacity:1; pointer-events:auto; }
  .cd-panel { text-align:center; }
  .cd-panel h2 {
    font-size: clamp(20px, 2.4vw, 28px);
    letter-spacing: 5px; font-weight: 700;
    color:#8d9cbe; margin-bottom: 6px;
  }
  .cd-num {
    font-size: clamp(80px, 12vw, 140px);
    font-weight: 900;
    background: linear-gradient(120deg,#7fd3ff,#a98bff 60%,#ff7fa8);
    -webkit-background-clip: text; background-clip:text; color:transparent;
    line-height: 1; margin: 4px 0;
    text-shadow: 0 0 80px rgba(120,200,255,.4);
    animation: cdPop .9s ease-out infinite;
  }
  @keyframes cdPop {
    0% { transform: scale(1); }
    20% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  .cd-msg {
    color:#a8c4f0; font-size: clamp(13px, 1.6vw, 16px);
    letter-spacing: 2px; margin-top: 6px;
  }

  .panel {
    text-align:center;
    padding: clamp(16px,2.5vw,32px) clamp(22px,3.5vw,50px);
    max-width: 680px;
    animation: pop .35s cubic-bezier(.2,1.4,.5,1);
    max-height: 100%;
    overflow-y: auto;
  }
  @keyframes pop { from { transform:scale(.9); opacity:0 } to { transform:scale(1); opacity:1 } }

  .panel h1 {
    font-size: clamp(22px, 3.6vw, 40px);
    letter-spacing: 5px;
    background: linear-gradient(120deg,#7fd3ff,#a98bff 55%,#ff7fa8);
    -webkit-background-clip: text; background-clip:text; color:transparent;
    margin-bottom: 8px; font-weight: 900;
  }
  .panel .sub {
    color:#8d9cbe; font-size: clamp(12px,1.4vw,14px);
    margin-bottom: 16px; line-height:1.6;
  }
  .btn {
    display:block; width:100%;
    margin: 9px 0;
    padding: clamp(10px,1.3vw,13px) 20px;
    font-size: clamp(13px,1.5vw,15px);
    font-weight:700; font-family:inherit;
    color:#e8eefc; cursor:pointer;
    border-radius: 12px;
    border: 1px solid rgba(120,160,255,.28);
    background: rgba(28,38,60,.82);
    transition: transform .13s, box-shadow .2s, background .2s, border-color .2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }
  .btn.seeker { border-color: rgba(255,90,120,.45); }
  .btn.seeker:hover { background: rgba(70,18,32,.9); box-shadow: 0 0 28px rgba(255,70,110,.35); }
  .btn.hider  { border-color: rgba(70,220,150,.45); }
  .btn.hider:hover  { background: rgba(14,58,42,.9); box-shadow: 0 0 28px rgba(60,220,150,.3); }
  .btn.again:hover { background: rgba(30,48,86,.95); box-shadow: 0 0 28px rgba(90,150,255,.35); }
  .btn.secondary {
    background: rgba(20,28,44,.82);
    border-color: rgba(90,120,180,.25);
    color: #a8b8d4;
    font-size: 13px;
    padding: 9px 20px;
  }
  .btn.secondary:hover { background: rgba(30,42,66,.95); color:#c4d0e8; }

  .setting-group { text-align: left; margin: 12px 0; }
  .setting-label {
    color:#8d9cbe; font-size: 12px;
    margin-bottom: 8px; letter-spacing: 1px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .setting-label .val { color:#a8c4f0; font-weight: 700; font-size: 13px; }
  .option-row { display: flex; gap: 6px; }
  .option-row button {
    flex: 1; padding: 9px 0;
    border-radius: 10px;
    border: 1px solid rgba(120, 160, 255, 0.25);
    background: rgba(28, 38, 60, 0.7);
    color: #c4d0e8; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    transition: all .15s;
  }
  .option-row button:hover { background: rgba(40, 55, 85, 0.9); }
  .option-row button.active {
    background: linear-gradient(135deg, rgba(80, 130, 220, 0.6), rgba(150, 100, 220, 0.5));
    border-color: rgba(140, 200, 255, 0.6);
    color: #fff;
    box-shadow: 0 0 16px rgba(110, 170, 255, 0.4);
  }

  /* 结算数据表格 */
  .result-stats {
    background: rgba(12,20,36,.78);
    border: 1px solid rgba(90,140,255,.2);
    border-radius: 12px;
    padding: 12px 16px;
    margin: 8px 0 14px;
    text-align: left;
  }
  .stat-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 5px 0;
    font-size: clamp(12px,1.3vw,14px);
    border-bottom: 1px solid rgba(90,140,255,.08);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .stat-key { color: #7d8db3; }
  .stat-row .stat-val { color: #d4e2fc; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-row .stat-val.good { color: #7fffc4; }
  .stat-row .stat-val.bad  { color: #ff8fa3; }

  .hint {
    margin-top: 12px;
    font-size: clamp(11px,1.25vw,12px);
    color:#5f6f92; line-height:1.8;
  }
  .hint b { color:#8fa8dd; font-weight:600; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hud-item"><span class="label">时间</span><span id="timeText">2:00</span></div>
    <div class="hud-item"><span class="label">剩余躲藏者</span><span id="aliveText">6</span></div>
    <div class="hud-item"><span class="label">身份</span><span id="roleText">—</span></div>
    <div class="hud-item" id="spectatorBadge"><span>👁 上帝视角</span></div>
    <div class="hud-item cooling" id="noiseMeter">
      <span class="label">噪声</span>
      <div class="bar"><div class="fill" id="noiseFill"></div></div>
    </div>
  </div>

  <div id="wrap">
    <canvas id="cv" width="960" height="600"></canvas>
    <div id="toast"></div>

    <div id="countdownOverlay">
      <div class="cd-panel">
        <h2>准 备</h2>
        <div class="cd-num" id="countdownNum">3</div>
        <p class="cd-msg" id="countdownMsg">藏好，别被抓到！</p>
      </div>
    </div>

    <div id="pauseOverlay">
      <div class="pause-panel">
        <h2>暂 停</h2>
        <p class="pause-hint">按 <kbd>ESC</kbd> 继续游戏</p>
        <button class="btn again" id="pauseRestart">🔄 &nbsp;重新开始</button>
        <button class="btn secondary" id="pauseMenu">🏠 &nbsp;返回菜单</button>
      </div>
    </div>

    <div id="overlay">
      <div class="panel" id="panel"></div>
      <button class="result-min-btn" id="resultMinBtn" type="button">— 收起结算</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ============================================================
   ★ 可配置参数
============================================================ */
const W = 960, H = 600;

const MAP_PRESETS = {
  small:  { TILE: 30, COLS: 32, ROWS: 20, walls: 26 },
  medium: { TILE: 24, COLS: 40, ROWS: 25, walls: 58 },
  large:  { TILE: 20, COLS: 48, ROWS: 30, walls: 92 }
};

let TILE = 24;
let COLS = 40;
let ROWS = 25;
let WALL_COUNT = 58;

const BASE_SPEED       = 130;
const WALK_MUL         = 0.5;
const RUN_MUL          = 1.0;
const SEEKER_SPEED_MUL = 1.12;

const SOUND_INTERVAL    = 0.5;
const SOUND_SPEED_TILES = 10;
let   SOUND_SPEED       = SOUND_SPEED_TILES * TILE;
const WALK_SOUND_RADIUS = 220;
const RUN_SOUND_RADIUS  = 440;
const WALK_RAY_COUNT    = 8;
const RUN_RAY_COUNT     = 8;
const MAX_BOUNCE        = 2;
const MAX_SOUND_WAVES   = 70;

const NOISE_RADIUS   = RUN_SOUND_RADIUS * 1.5;
const NOISE_RAY_MUL  = 2;
const NOISE_COOLDOWN = 4.0;
const NOISE_AI_MIN_INTERVAL = 3.5;

const WALL_MEMORY_HOLD = 1.0;
const WALL_MEMORY_FADE = 1.4;

const PLAYER_MARKER_PULSE_SPEED = 4.0;
const DETECT_FADE_TIME  = 0.9;
const DETECT_RISE_TIME  = 0.07;

const DEFAULT_GAME_TIME = 120;
const SEEKER_R    = 9.0;
const HIDER_R     = 8.0;
const SPECTATOR_GRACE = 2.0;
const START_COUNTDOWN = 3.0;

/* ============================================================
   基础工具
============================================================ */
const canvas = document.getElementById('cv');
const ctx    = canvas.getContext('2d');

const rand  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const tx = v => clamp(Math.floor(v / TILE), 0, COLS - 1);
const ty = v => clamp(Math.floor(v / TILE), 0, ROWS - 1);
const fmtTime = (sec) => {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2,'0')}`;
};

/* ============================================================
   时间系统
============================================================ */
let totalPausedMs = 0;
let pauseStartMs  = 0;
function nowSec() { return (performance.now() - totalPausedMs) / 1000; }
function visualNowSec() {
  return state === 'over' && frozenRenderTime !== null ? frozenRenderTime : nowSec();
}

/* ============================================================
   全局状态
============================================================ */
let grid = null;
let openCells = null;
let entities = [];
let seekers = [];
let hiders = [];
let player = null;
let players = [];
let soundWaves = [];
let wallMemoryMap = new Map();

let timeLeft = DEFAULT_GAME_TIME;
let state = 'menu';
let spectator = false;
let paused = false;
let lastT = 0;
const keys = {};
let pendingGameEnd = null;

// 结算时展示上帝视角
let showGodView = false;
let frozenRenderTime = null;
// 结算统计数据
let stats = {};

// 倒计时
let countdownRemain = 0;

// 实体 ID 分配
let nextEntityId = 1;

// 设置
let selectedRole = 'hider';
let cfgSeekerCount = 1;
let cfgHiderCount = 6;
let cfgPlayerCount = 1;
let cfgMapSize = 'medium';
let cfgGameTime = DEFAULT_GAME_TIME;

const overlay  = document.getElementById('overlay');
const panel    = document.getElementById('panel');
const toastEl  = document.getElementById('toast');
const timeEl   = document.getElementById('timeText');
const aliveEl  = document.getElementById('aliveText');
const roleEl   = document.getElementById('roleText');
const specEl   = document.getElementById('spectatorBadge');
const pauseEl  = document.getElementById('pauseOverlay');
const noiseMeterEl = document.getElementById('noiseMeter');
const noiseFillEl  = document.getElementById('noiseFill');
const countdownEl  = document.getElementById('countdownOverlay');
const countdownNumEl = document.getElementById('countdownNum');
const countdownMsgEl = document.getElementById('countdownMsg');
const resultMinBtn = document.getElementById('resultMinBtn');

/* ============================================================
   地图生成
============================================================ */
function buildRandomMap() {
  const g = Array.from({ length: ROWS }, () => new Array(COLS).fill(0));
  for (let x = 0; x < COLS; x++) { g[0][x] = 1; g[ROWS - 1][x] = 1; }
  for (let y = 0; y < ROWS; y++) { g[y][0] = 1; g[y][COLS - 1] = 1; }

  for (let i = 0; i < WALL_COUNT; i++) {
    let w, h;
    const r = Math.random();
    if (r < 0.22)      { w = 4 + ((Math.random() * 3) | 0); h = 1; }
    else if (r < 0.44) { w = 1; h = 4 + ((Math.random() * 3) | 0); }
    else               { w = 1 + ((Math.random() * 3) | 0); h = 1 + ((Math.random() * 3) | 0); }

    const x = 1 + ((Math.random() * (COLS - 2 - w)) | 0);
    const y = 1 + ((Math.random() * (ROWS - 2 - h)) | 0);
    for (let yy = y; yy < y + h; yy++)
      for (let xx = x; xx < x + w; xx++) g[yy][xx] = 1;
  }
  return g;
}

function labelComponents(g) {
  const comp = Array.from({ length: ROWS }, () => new Array(COLS).fill(0));
  let id = 0, bestId = 0, bestSize = 0;
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (g[y][x] !== 0 || comp[y][x] !== 0) continue;
      id++;
      let size = 0;
      const stack = [[x, y]];
      comp[y][x] = id;
      while (stack.length) {
        const [cx, cy] = stack.pop();
        size++;
        const nb = [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]];
        for (let k = 0; k < 4; k++) {
          const nx = nb[k][0], ny = nb[k][1];
          if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
          if (g[ny][nx] !== 0 || comp[ny][nx] !== 0) continue;
          comp[ny][nx] = id;
          stack.push([nx, ny]);
        }
      }
      if (size > bestSize) { bestSize = size; bestId = id; }
    }
  }
  return { comp, bestId, bestSize };
}

function generateMap() {
  let fallback = null;
  for (let attempt = 0; attempt < 40; attempt++) {
    const g = buildRandomMap();
    const { comp, bestId, bestSize } = labelComponents(g);
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (g[y][x] === 0 && comp[y][x] !== bestId) g[y][x] = 1;
    if (bestSize >= COLS * ROWS * 0.40) return g;
    if (!fallback || bestSize > fallback.size) fallback = { g, size: bestSize };
  }
  const g = Array.from({ length: ROWS }, () => new Array(COLS).fill(0));
  for (let x = 0; x < COLS; x++) { g[0][x] = 1; g[ROWS - 1][x] = 1; }
  for (let y = 0; y < ROWS; y++) { g[y][0] = 1; g[y][COLS - 1] = 1; }
  return g;
}

function getOpenCells() {
  if (!openCells) {
    openCells = [];
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (grid[y][x] === 0) openCells.push({ x, y });
  }
  return openCells;
}
function randomOpenCell() {
  const list = getOpenCells();
  return list[(Math.random() * list.length) | 0];
}

/* ============================================================
   碰撞 & 移动
============================================================ */
function circleHitsWall(x, y, r) {
  const minTx = tx(x - r), maxTx = tx(x + r);
  const minTy = ty(y - r), maxTy = ty(y + r);
  for (let cyy = minTy; cyy <= maxTy; cyy++) {
    for (let cxx = minTx; cxx <= maxTx; cxx++) {
      if (grid[cyy][cxx] !== 1) continue;
      const rx = cxx * TILE, ry = cyy * TILE;
      const nx = clamp(x, rx, rx + TILE);
      const ny = clamp(y, ry, ry + TILE);
      const dx = x - nx, dy = y - ny;
      if (dx * dx + dy * dy < r * r) return true;
    }
  }
  return false;
}

function moveEntity(e, dx, dy) {
  if (dx) { e.x += dx; if (circleHitsWall(e.x, e.y, e.r)) e.x -= dx; }
  if (dy) { e.y += dy; if (circleHitsWall(e.x, e.y, e.r)) e.y -= dy; }
}

/* ============================================================
   寻路
============================================================ */
function findPath(sx, sy, gx, gy) {
  if (sx === gx && sy === gy) return [];
  if (gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) return null;
  if (grid[gy][gx] === 1) return null;

  const total = COLS * ROWS;
  const prev = new Int32Array(total).fill(-1);
  const seen = new Uint8Array(total);
  const start = sy * COLS + sx;
  const goal  = gy * COLS + gx;

  const queue = new Int32Array(total);
  let head = 0, tail = 0;
  queue[tail++] = start;
  seen[start] = 1;
  let found = false;

  while (head < tail) {
    const cur = queue[head++];
    if (cur === goal) { found = true; break; }
    const cx = cur % COLS, cy = (cur / COLS) | 0;
    if (cx + 1 < COLS) { const n = cur + 1;    if (!seen[n] && grid[cy][cx + 1] === 0) { seen[n] = 1; prev[n] = cur; queue[tail++] = n; } }
    if (cx - 1 >= 0)   { const n = cur - 1;    if (!seen[n] && grid[cy][cx - 1] === 0) { seen[n] = 1; prev[n] = cur; queue[tail++] = n; } }
    if (cy + 1 < ROWS) { const n = cur + COLS; if (!seen[n] && grid[cy + 1][cx] === 0) { seen[n] = 1; prev[n] = cur; queue[tail++] = n; } }
    if (cy - 1 >= 0)   { const n = cur - COLS; if (!seen[n] && grid[cy - 1][cx] === 0) { seen[n] = 1; prev[n] = cur; queue[tail++] = n; } }
  }

  if (!found) return null;
  const path = [];
  let cur = goal;
  while (cur !== start) {
    path.push({ x: cur % COLS, y: (cur / COLS) | 0 });
    cur = prev[cur];
    if (cur < 0) return null;
  }
  path.reverse();
  return path;
}

function computePathFor(e, gx, gy) {
  const p = findPath(tx(e.x), ty(e.y), tx(gx), ty(gy));
  e.path = p || null;
  e.pathIdx = 0;
  e.stuckCount = 0;
}

function followPath(e, dt, mul = 1) {
  if (!e.path || e.pathIdx >= e.path.length) return false;

  const node = e.path[e.pathIdx];
  const gx = node.x * TILE + TILE / 2;
  const gy = node.y * TILE + TILE / 2;
  const dx = gx - e.x, dy = gy - e.y;
  const d = Math.hypot(dx, dy);
  if (d < 5) {
    e.pathIdx++;
    e.stuckTimer = 0;
    e.lastPathX = e.x;
    e.lastPathY = e.y;
    return true;
  }

  const sp = BASE_SPEED * mul;
  const px = e.x, py = e.y;
  moveEntity(e, dx / d * sp * dt, dy / d * sp * dt);

  const moved = Math.hypot(e.x - px, e.y - py);
  if (moved < 0.25) {
    e.stuckTimer = (e.stuckTimer || 0) + dt;
    // 不再跳过被墙挡住的节点：保留当前路径，让 AI 短暂观察后强制重规划。
    if (e.stuckTimer >= 0.32) {
      e.path = null;
      e.pathIdx = 0;
      e.repathTimer = 0;
      e.stuckTimer = 0;
      return false;
    }
  } else {
    e.stuckTimer = 0;
    e.lastPathX = e.x;
    e.lastPathY = e.y;
  }
  return true;
}


/* ============================================================
   声波系统
============================================================ */
function castRay(sx, sy, angle, maxDist, maxBounce, emitter, entityHits, wallHits) {
  const path = [{ x: sx, y: sy, dist: 0 }];
  let cx = sx, cy = sy;
  let dx = Math.cos(angle), dy = Math.sin(angle);
  let totalDist = 0;
  let bounces = 0;
  const nowT = nowSec();

  while (totalDist < maxDist && bounces <= maxBounce) {
    const remain = maxDist - totalDist;
    const step = 4;
    let hit = false;
    let hitX = 0, hitY = 0, hitNormal = null;
    let entityHit = null;
    let hitCell = null;

    for (let d = step; d <= remain; d += step) {
      const nx = cx + dx * d;
      const ny = cy + dy * d;
      const gx = Math.floor(nx / TILE);
      const gy = Math.floor(ny / TILE);
      if (gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) break;

      let foundEntity = null;
      for (const other of entities) {
        if (other === emitter) continue;
        if (other.type === 'hider' && !other.alive) continue;
        const odx = nx - other.x, ody = ny - other.y;
        if (odx * odx + ody * ody < other.r * other.r) {
          foundEntity = other;
          break;
        }
      }
      if (foundEntity) {
        hit = true;
        hitX = nx; hitY = ny;
        entityHit = foundEntity;
        break;
      }

      if (grid[gy][gx] === 1) {
        const prevD = Math.max(0, d - step);
        const px = cx + dx * prevD;
        const py = cy + dy * prevD;
        const cellX = gx * TILE, cellY = gy * TILE;
        const relX = (nx - cellX) / TILE;
        const relY = (ny - cellY) / TILE;
        if (relX < 0.2) hitNormal = { x: -1, y: 0 };
        else if (relX > 0.8) hitNormal = { x: 1, y: 0 };
        else if (relY < 0.2) hitNormal = { x: 0, y: -1 };
        else if (relY > 0.8) hitNormal = { x: 0, y: 1 };
        else hitNormal = { x: -dx, y: -dy };
        hitX = px; hitY = py;
        hitCell = { gx, gy };
        hit = true;
        break;
      }
    }

    if (!hit) {
      const endX = cx + dx * remain;
      const endY = cy + dy * remain;
      path.push({ x: endX, y: endY, dist: totalDist + remain });
      break;
    } else {
      const segLen = Math.hypot(hitX - cx, hitY - cy);
      const hitDist = totalDist + segLen;
      path.push({ x: hitX, y: hitY, dist: hitDist });
      totalDist = hitDist;

      if (entityHit) {
        entityHits.push({
          x: hitX, y: hitY, dist: hitDist,
          emitter: emitter,
          target: entityHit
        });

        if (emitter.type === 'seeker' && entityHit.type === 'hider' && entityHit.ai) {
          entityHit.ai.detectedBySeeker = nowT;
          entityHit.ai.detectedBySeekerPos = { x: emitter.x, y: emitter.y };
        }
        if (emitter.type === 'hider' && entityHit.type === 'seeker' && emitter.ai) {
          const existing = emitter.ai.threatZones.find(
            t => Math.hypot(t.x - hitX, t.y - hitY) < 60
          );
          if (existing) {
            existing.time = nowT;
            existing.intensity = Math.max(existing.intensity, 1.5);
          } else {
            emitter.ai.threatZones.push({
              x: hitX, y: hitY, time: nowT, intensity: 1.5
            });
          }
        }

        // ★ 统计：与玩家相关的探测
        if (emitter.isPlayer && !entityHit.isPlayer) stats.playerDetectedEnemy++;
        if (entityHit.isPlayer && !emitter.isPlayer) stats.playerDetectedByEnemy++;

        break;
      }

      if (wallHits && hitCell) {
        wallHits.push({ gx: hitCell.gx, gy: hitCell.gy, dist: hitDist });
      }

      const dot = dx * hitNormal.x + dy * hitNormal.y;
      dx = dx - 2 * dot * hitNormal.x;
      dy = dy - 2 * dot * hitNormal.y;
      const len = Math.hypot(dx, dy);
      if (len < 0.001) break;
      dx /= len; dy /= len;
      cx = hitX; cy = hitY;
      bounces++;
    }
  }
  return path;
}

function emitSound(e, isNoise = false) {
  const isRun = (e.speedMode === 'run') && !isNoise;
  const maxRadius = isNoise ? NOISE_RADIUS : (isRun ? RUN_SOUND_RADIUS : WALK_SOUND_RADIUS);
  const strength = isNoise ? 1.4 : (isRun ? 1.0 : 0.5);

  let rayCount;
  if (isNoise) rayCount = RUN_RAY_COUNT * NOISE_RAY_MUL;
  else if (isRun) rayCount = RUN_RAY_COUNT;
  else rayCount = WALK_RAY_COUNT;

  const rays = [];
  const rawHits = [];
  const wallHits = [];
  const angleOffset = Math.random() * Math.PI * 2 / rayCount;

  for (let i = 0; i < rayCount; i++) {
    const angle = (i / rayCount) * Math.PI * 2 + angleOffset;
    const path = castRay(e.x, e.y, angle, maxRadius, MAX_BOUNCE, e, rawHits, wallHits);
    if (path.length > 1) rays.push(path);
  }

  const hitMap = new Map();
  for (const h of rawHits) {
    const key = h.target;
    if (!hitMap.has(key) || h.dist < hitMap.get(key).dist) hitMap.set(key, h);
  }
  const hits = Array.from(hitMap.values());
  const nowT = nowSec();

  soundWaves.push({
    x: e.x, y: e.y,
    maxRadius, strength, age: 0,
    rays, hits, emitTime: nowT,
    emitter: e
  });

  // 墙壁记忆
  for (const wh of wallHits) {
    const key = `${e.id},${wh.gx},${wh.gy}`;
    const arrivalTime = nowT + wh.dist / SOUND_SPEED;
    const existing = wallMemoryMap.get(key);
    if (existing) {
      existing.arrivals.push(arrivalTime);
      if (existing.arrivals.length > 12) {
        existing.arrivals.splice(0, existing.arrivals.length - 12);
      }
      existing.strength = Math.max(existing.strength, strength);
    } else {
      wallMemoryMap.set(key, {
        emitterId: e.id,
        gx: wh.gx, gy: wh.gy,
        arrivals: [arrivalTime],
        strength
      });
    }
  }

  if (e.type === 'seeker' && !e.isPlayer) {
    let nearest = null;
    for (const h of hits) {
      if (h.target.type === 'hider' && h.target.alive) {
        if (!nearest || h.dist < nearest.dist) nearest = h;
      }
    }
    if (nearest) {
      e.spottedTarget = {
        x: nearest.target.x, y: nearest.target.y,
        target: nearest.target,
        arriveTime: nowT + nearest.dist / SOUND_SPEED
      };
    }
  }

  if (soundWaves.length > MAX_SOUND_WAVES) {
    soundWaves.splice(0, soundWaves.length - MAX_SOUND_WAVES);
  }

  for (const other of entities) {
    if (other === e) continue;
    if (other.type === 'hider' && !other.alive) continue;
    const dist = Math.hypot(other.x - e.x, other.y - e.y);
    if (dist < maxRadius * 1.15) {
      other.heardSound = {
        x: e.x, y: e.y,
        strength,
        emitTime: nowT,
        arrivalTime: nowT + dist / SOUND_SPEED
      };
    }
  }
}

function tryEmitNoise(e) {
  const nowT = nowSec();
  const cooldown = e.isPlayer ? NOISE_COOLDOWN : NOISE_AI_MIN_INTERVAL;
  if (e.noiseCooldownUntil && nowT < e.noiseCooldownUntil) return false;
  e.noiseCooldownUntil = nowT + cooldown;
  if (e.isPlayer) stats.playerNoiseCount++;
  emitSound(e, true);
  return true;
}

/* ============================================================
   AI 辅助函数
============================================================ */
function pickPatrolTarget(e, nowT) {
  const list = getOpenCells();
  let best = null, bestScore = -Infinity;
  const ai = e.ai;
  for (let i = 0; i < 40; i++) {
    const c = list[(Math.random() * list.length) | 0];
    const key = `${c.x},${c.y}`;
    const lastVisit = ai.visitedCells.get(key) || 0;
    const sinceVisit = nowT - lastVisit;
    const wx = c.x * TILE + TILE / 2;
    const wy = c.y * TILE + TILE / 2;
    const d = Math.hypot(wx - e.x, wy - e.y);
    let score = Math.min(sinceVisit, 90) * 3.0;
    score -= d * 0.3;
    if (score > bestScore) { bestScore = score; best = c; }
  }
  return best;
}

function generateSearchPoints(cx, cy, count) {
  const points = [];
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 50 + Math.random() * 240;
    const x = cx + Math.cos(angle) * dist;
    const y = cy + Math.sin(angle) * dist;
    const gx = tx(x), gy = ty(y);
    if (gx >= 0 && gy >= 0 && gx < COLS && gy < ROWS && grid[gy][gx] === 0) {
      points.push({ x: gx * TILE + TILE / 2, y: gy * TILE + TILE / 2, visited: false });
    }
  }
  return points;
}

function cellQuality(gx, gy) {
  if (gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) return 0;
  if (grid[gy][gx] === 1) return 0;
  let open = 0;
  for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
    const nx = gx + dx, ny = gy + dy;
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
    if (grid[ny][nx] === 0) open++;
  }
  return open;
}

function scoreHideSpot(x, y, e, nowT) {
  let score = 0;
  let minThreatDist = 800;
  for (const t of e.ai.threatZones) {
    const d = Math.hypot(x - t.x, y - t.y);
    if (d < minThreatDist) minThreatDist = d;
  }
  score += Math.min(minThreatDist, 600) * 1.4;

  for (const s of seekers) {
    const d = Math.hypot(x - s.x, y - s.y);
    score += Math.min(d, 500) * 0.8;
  }

  let wallCount = 0;
  const cgx = tx(x), cgy = ty(y);
  for (let dy = -2; dy <= 2; dy++) {
    for (let dx = -2; dx <= 2; dx++) {
      if (dx === 0 && dy === 0) continue;
      const gx = cgx + dx, gy = cgy + dy;
      if (gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) continue;
      if (grid[gy][gx] === 1) wallCount++;
    }
  }
  score += wallCount * 5;

  const q = cellQuality(cgx, cgy);
  if (q === 2 || q === 3) score += 40;
  else if (q === 1) score -= 50;
  else if (q === 4) score -= 15;

  for (const other of hiders) {
    if (other === e || !other.alive) continue;
    const d = Math.hypot(x - other.x, y - other.y);
    if (d < 220) score -= (220 - d) * 1.2;
  }

  const dSelf = Math.hypot(x - e.x, y - e.y);
  score -= dSelf * 0.6;
  return score;
}

function pickHideSpot(e, nowT) {
  const list = getOpenCells();
  let best = null, bestScore = -Infinity;
  for (let i = 0; i < 40; i++) {
    const c = list[(Math.random() * list.length) | 0];
    const wx = c.x * TILE + TILE / 2;
    const wy = c.y * TILE + TILE / 2;
    const score = scoreHideSpot(wx, wy, e, nowT);
    if (score > bestScore) { bestScore = score; best = { x: wx, y: wy }; }
  }
  return best;
}

function chooseFleePoint(e, threatX, threatY) {
  const list = getOpenCells();
  let best = null, bestScore = -Infinity;

  const ax = e.x - threatX, ay = e.y - threatY;
  const alen = Math.hypot(ax, ay) || 1;
  const fleeDirX = ax / alen, fleeDirY = ay / alen;

  for (let i = 0; i < 60; i++) {
    const c = list[(Math.random() * list.length) | 0];
    const wx = c.x * TILE + TILE / 2;
    const wy = c.y * TILE + TILE / 2;

    const dx = wx - e.x, dy = wy - e.y;
    const dist = Math.hypot(dx, dy) || 1;
    const dirX = dx / dist, dirY = dy / dist;

    const dotFlee = dirX * fleeDirX + dirY * fleeDirY;
    const toThreat = Math.hypot(wx - threatX, wy - threatY);

    let minSeekerDist = Infinity;
    for (const s of seekers) {
      const d = Math.hypot(wx - s.x, wy - s.y);
      if (d < minSeekerDist) minSeekerDist = d;
    }

    const q = cellQuality(tx(wx), ty(wy));

    let score = 0;
    score += dotFlee * 180;
    score += Math.min(toThreat, 600) * 1.5;
    score += Math.min(minSeekerDist, 500) * 1.0;
    if (q >= 3) score += 50;
    else if (q === 1) score -= 80;
    score -= dist * 0.25;

    for (const other of hiders) {
      if (other === e || !other.alive) continue;
      const d = Math.hypot(wx - other.x, wy - other.y);
      if (d < 120) score -= (120 - d) * 2;
    }

    if (score > bestScore) { bestScore = score; best = { x: wx, y: wy }; }
  }
  return best || { x: e.x, y: e.y };
}

/* ============================================================
   实体创建
============================================================ */
function pickSpawns(n) {
  const cells = getOpenCells().slice();
  for (let i = cells.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const t = cells[i]; cells[i] = cells[j]; cells[j] = t;
  }
  const chosen = [];
  let minD = 9;
  for (let pass = 0; pass < 5 && chosen.length < n; pass++) {
    for (const c of cells) {
      if (chosen.length >= n) break;
      let ok = true;
      for (const p of chosen) {
        if (Math.hypot(p.x - c.x, p.y - c.y) < minD) { ok = false; break; }
      }
      if (ok) chosen.push(c);
    }
    minD -= 2;
  }
  while (chosen.length < n && cells.length) {
    chosen.push(cells[(Math.random() * cells.length) | 0]);
  }
  return chosen.map(c => ({ x: c.x * TILE + TILE / 2, y: c.y * TILE + TILE / 2 }));
}

function makeSeeker(spawn, isPlayer, controlScheme = 'p1') {
  return {
    id: nextEntityId++,
    type: 'seeker',
    x: spawn.x, y: spawn.y,
    r: SEEKER_R,
    isPlayer,
    controlScheme,
    speedMode: 'walk',
    soundTimer: 0,
    noiseCooldownUntil: 0,
    _px: spawn.x, _py: spawn.y,
    path: null, pathIdx: 0, repathTimer: 0, stuckCount: 0,
    goal: null,
    heardSound: null,
    spottedTarget: null,
    stuckTimer: 0,
    lastPathX: spawn.x,
    lastPathY: spawn.y,
    ai: {
      state: 'patrol',
      stateStart: 0,
      target: null,
      patrol: null,
      searchCenter: null,
      searchPoints: [],
      searchExpire: 0,
      visitedCells: new Map(),
      repathFast: false,
      lastNoise: 0,
      lastKnownHider: null
    }
  };
}

function makeHider(spawn, isPlayer, controlScheme = 'p1') {
  return {
    id: nextEntityId++,
    type: 'hider',
    x: spawn.x, y: spawn.y,
    r: HIDER_R,
    isPlayer,
    controlScheme,
    alive: true,
    speedMode: 'walk',
    soundTimer: 0,
    noiseCooldownUntil: 0,
    _px: spawn.x, _py: spawn.y,
    path: null, pathIdx: 0, repathTimer: 0, stuckCount: 0,
    heardSound: null,
    ai: {
      state: 'hide',
      stateStart: 0,
      threatZones: [],
      hideSpot: null,
      fleeTarget: null,
      restTimer: rand(1, 3),
      detectedBySeeker: 0,
      detectedBySeekerPos: null,
      lastNoise: 0,
      lastFleeFrom: null,
      quietTicks: 0
    }
  };
}

function buildEntities(role) {
  entities = [];
  seekers = [];
  hiders = [];
  players = [];
  nextEntityId = 1;

  const humanCount = Math.min(2, Math.max(1, cfgPlayerCount));
  const total = cfgSeekerCount + cfgHiderCount;
  const spawns = pickSpawns(total);
  let idx = 0;

  for (let i = 0; i < cfgSeekerCount; i++) {
    const isHuman = role === 'seeker' && i < humanCount;
    const s = makeSeeker(spawns[idx++], isHuman, i === 0 ? 'p1' : 'p2');
    seekers.push(s);
    entities.push(s);
    if (isHuman) players.push(s);
  }
  for (let i = 0; i < cfgHiderCount; i++) {
    const isHuman = role === 'hider' && i < humanCount;
    const h = makeHider(spawns[idx++], isHuman, i === 0 ? 'p1' : 'p2');
    hiders.push(h);
    entities.push(h);
    if (isHuman) players.push(h);
  }

  player = players[0] || entities[0] || null;
}


/* ============================================================
   AI — 追捕者
============================================================ */
function updateSeekerAI(e, dt) {
  const nowT = nowSec();
  const ai = e.ai;

  ai.visitedCells.set(`${tx(e.x)},${ty(e.y)}`, nowT);
  if (ai.visitedCells.size > 800) {
    for (const [k, t] of ai.visitedCells) {
      if (nowT - t > 45) ai.visitedCells.delete(k);
    }
  }

  const spotFresh = e.spottedTarget && nowT - e.spottedTarget.arriveTime < 3.5;
  const hearFresh = e.heardSound && nowT >= e.heardSound.arrivalTime && nowT - e.heardSound.emitTime < 5.0;

  if (spotFresh) {
    if (ai.state !== 'chase') ai.state = 'chase';
    ai.stateStart = nowT;
    const liveTarget = e.spottedTarget.target;
    if (liveTarget && liveTarget.type === 'hider' && liveTarget.alive) {
      ai.target = { x: liveTarget.x, y: liveTarget.y };
    } else {
      ai.target = { x: e.spottedTarget.x, y: e.spottedTarget.y };
    }
    ai.lastKnownHider = { x: ai.target.x, y: ai.target.y, time: nowT };
  } else if (ai.state === 'chase' && nowT - ai.stateStart < 4.0) {
    // 保持追击
  } else if (ai.state === 'chase' && ai.target) {
    ai.state = 'search';
    ai.stateStart = nowT;
    ai.searchCenter = { x: ai.target.x, y: ai.target.y };
    ai.searchExpire = nowT + 8.0;
    ai.searchPoints = generateSearchPoints(ai.searchCenter.x, ai.searchCenter.y, 7);
  } else if (hearFresh) {
    if (ai.state !== 'investigate' && ai.state !== 'chase') {
      ai.state = 'investigate';
      ai.stateStart = nowT;
    }
    ai.target = { x: e.heardSound.x, y: e.heardSound.y };
  } else if (ai.state === 'investigate' && nowT - ai.stateStart < 3.0 && ai.target) {
    // 继续调查
  } else if (ai.state === 'search' && nowT < ai.searchExpire && ai.searchPoints.some(p => !p.visited)) {
    // 继续搜索
  } else {
    ai.state = 'patrol';
  }

  let speedMode = 'walk';

  if (ai.state === 'chase') {
    e.goal = ai.target;
    speedMode = 'run';
    ai.repathFast = true;
  } else if (ai.state === 'investigate') {
    e.goal = ai.target;
    speedMode = 'run';
    ai.repathFast = true;
  } else if (ai.state === 'search') {
    if (nowT - ai.lastNoise > NOISE_AI_MIN_INTERVAL) {
      if (tryEmitNoise(e)) ai.lastNoise = nowT;
    }
    let nextPoint = null;
    for (const p of ai.searchPoints) { if (!p.visited) { nextPoint = p; break; } }
    if (!nextPoint) {
      ai.state = 'patrol';
    } else {
      const d = Math.hypot(nextPoint.x - e.x, nextPoint.y - e.y);
      if (d < 25) { nextPoint.visited = true; }
      else {
        e.goal = { x: nextPoint.x, y: nextPoint.y };
        speedMode = 'run';
        ai.repathFast = true;
      }
    }
  }

  if (ai.state === 'patrol') {
    const arrive = !ai.patrol ||
      Math.hypot(ai.patrol.x * TILE + TILE / 2 - e.x, ai.patrol.y * TILE + TILE / 2 - e.y) < 30;
    if (arrive) ai.patrol = pickPatrolTarget(e, nowT);
    if (ai.patrol) e.goal = { x: ai.patrol.x * TILE + TILE / 2, y: ai.patrol.y * TILE + TILE / 2 };
    speedMode = 'run';
    if (nowT - ai.lastNoise > NOISE_AI_MIN_INTERVAL * 1.8) {
      if (tryEmitNoise(e)) ai.lastNoise = nowT;
    }
  }

  e.speedMode = speedMode;
  e.repathTimer -= dt;

  const needRepath = !e.path || e.pathIdx >= e.path.length || e.repathTimer <= 0;
  if (needRepath && e.goal) {
    computePathFor(e, e.goal.x, e.goal.y);
    if (!e.path) {
      if (ai.state === 'patrol') {
        ai.patrol = null;
        e.repathTimer = 0.2;
      } else if (ai.state === 'search') {
        ai.searchPoints = ai.searchPoints.filter(p => !p.visited);
        e.repathTimer = 0.12;
      } else {
        // 追击 / 调查时路径暂时不可用，不退回巡逻，快速原地重算。
        e.repathTimer = 0.10;
      }
    } else {
      // 追击时频繁重规划，目标移动后不会让追捕者沿旧路线跑空。
      e.repathTimer = ai.state === 'chase' ? 0.18 : (ai.repathFast ? 0.3 : 1.2);
    }
    ai.repathFast = false;
  }

  if (e.path) {
    const mul = (speedMode === 'run' ? RUN_MUL : WALK_MUL) * SEEKER_SPEED_MUL;
    followPath(e, dt, mul);
    // followPath 发现连续碰撞后会清掉路径；下一帧立即按当前目标重规划。
    if (!e.path && (ai.state === 'chase' || ai.state === 'investigate')) {
      e.repathTimer = 0;
    }
  }
}

/* ============================================================
   AI — 躲藏者
============================================================ */
function updateHiderAI(e, dt) {
  const nowT = nowSec();
  const ai = e.ai;

  if (e.heardSound && nowT - e.heardSound.emitTime < 6.0) {
    const existing = ai.threatZones.find(t => Math.hypot(t.x - e.heardSound.x, t.y - e.heardSound.y) < 50);
    if (existing) {
      existing.time = nowT;
      existing.intensity = Math.max(existing.intensity, e.heardSound.strength);
    } else {
      ai.threatZones.push({ x: e.heardSound.x, y: e.heardSound.y, time: nowT, intensity: e.heardSound.strength });
    }
  }
  ai.threatZones = ai.threatZones.filter(t => nowT - t.time < 10.0);
  if (ai.threatZones.length > 15) ai.threatZones.splice(0, ai.threatZones.length - 15);

  if (ai.detectedBySeeker && nowT - ai.detectedBySeeker < 2.0) {
    const tx0 = ai.detectedBySeekerPos?.x || e.x;
    const ty0 = ai.detectedBySeekerPos?.y || e.y;
    ai.state = 'flee';
    ai.fleeTarget = chooseFleePoint(e, tx0, ty0);
    ai.stateStart = nowT;
    ai.lastFleeFrom = { x: tx0, y: ty0 };
    e.path = null;
    ai.detectedBySeeker = 0;
  }

  let nearestThreat = null, nearestDist = Infinity;
  for (const t of ai.threatZones) {
    const d = Math.hypot(t.x - e.x, t.y - e.y);
    if (d < nearestDist) { nearestDist = d; nearestThreat = t; }
  }

  if (ai.state !== 'flee') {
    if (nearestThreat && nearestDist < 170) {
      ai.state = 'flee';
      ai.fleeTarget = chooseFleePoint(e, nearestThreat.x, nearestThreat.y);
      ai.stateStart = nowT;
      ai.lastFleeFrom = { x: nearestThreat.x, y: nearestThreat.y };
      e.path = null;
    } else if (nearestThreat && nearestDist < 340) {
      if (ai.state !== 'frozen') {
        ai.state = 'frozen';
        ai.stateStart = nowT;
        e.path = null;
      }
    } else {
      if (ai.state === 'frozen' || ai.state === 'flee') {
        const recent = ai.threatZones.find(t => nowT - t.time < 3.0);
        if (!recent) {
          ai.state = 'hide';
          ai.restTimer = 1.0;
          e.path = null;
        }
      } else if (ai.state !== 'hide') {
        ai.state = 'hide';
      }
    }
  }

  if (ai.state === 'flee') {
    const newThreat = nearestThreat && (nowT - nearestThreat.time < 1.5) && nearestDist < 200;
    const tooLong = nowT - ai.stateStart > 5.5;
    const noTarget = !ai.fleeTarget;

    if (tooLong || noTarget) {
      ai.state = 'hide';
      ai.restTimer = 0.6;
      e.path = null;
      return;
    }
    if (newThreat) {
      ai.fleeTarget = chooseFleePoint(e, nearestThreat.x, nearestThreat.y);
      ai.stateStart = nowT;
      e.path = null;
    }
    e.speedMode = 'run';
    e.repathTimer -= dt;
    if (!e.path || e.pathIdx >= e.path.length || e.repathTimer <= 0) {
      computePathFor(e, ai.fleeTarget.x, ai.fleeTarget.y);
      if (!e.path) {
        ai.state = 'hide';
        ai.restTimer = 0.5;
        e.path = null;
        return;
      }
      e.repathTimer = 0.7;
    }
    followPath(e, dt, RUN_MUL);
    return;
  }

  if (ai.state === 'frozen') {
    e.speedMode = 'walk';
    return;
  }

  if (ai.state === 'hide') {
    const arrived = !e.path || e.pathIdx >= e.path.length;
    if (arrived) {
      ai.restTimer -= dt;
      e.speedMode = 'walk';
      if (ai.restTimer <= 0) {
        const newSpot = pickHideSpot(e, nowT);
        if (newSpot) {
          ai.hideSpot = newSpot;
          computePathFor(e, newSpot.x, newSpot.y);
          if (!e.path) {
            ai.restTimer = 0.6;
          } else {
            ai.restTimer = 3 + Math.random() * 4;
          }
        } else {
          ai.restTimer = 1.0;
        }
      }
    } else {
      e.speedMode = 'walk';
      followPath(e, dt, WALK_MUL);
    }
  }
}

/* ============================================================
   玩家输入
============================================================ */
function handlePlayerInput(dt) {
  if (spectator || !players.length) return;

  for (const p of players) {
    if (!p) continue;
    if (p.type === 'hider' && !p.alive) continue;

    let vx = 0, vy = 0;
    if (p.controlScheme === 'p2') {
      if (keys['arrowup']) vy--;
      if (keys['arrowdown']) vy++;
      if (keys['arrowleft']) vx--;
      if (keys['arrowright']) vx++;
      p.speedMode = 'walk';
    } else {
      if (keys['w']) vy--;
      if (keys['s']) vy++;
      if (keys['a']) vx--;
      if (keys['d']) vx++;
      p.speedMode = keys['shift'] ? 'run' : 'walk';
    }

    if (!vx && !vy) continue;

    const l = Math.hypot(vx, vy);
    vx /= l; vy /= l;
    const seekerMul = (p.type === 'seeker') ? SEEKER_SPEED_MUL : 1;
    const mul = (p.speedMode === 'run' ? RUN_MUL : WALK_MUL) * seekerMul;
    moveEntity(p, vx * BASE_SPEED * mul * dt, vy * BASE_SPEED * mul * dt);
  }
}


/* ============================================================
   游戏更新
============================================================ */
function allHumanHidersDead() {
  const humanHiders = players.filter(p => p.type === 'hider');
  return humanHiders.length > 0 && humanHiders.every(p => !p.alive);
}

function update(dt) {
  if (state === 'countdown') {
    countdownRemain -= dt;
    if (countdownRemain <= 0) {
      state = 'playing';
      countdownEl.classList.remove('show');
    } else {
      const n = Math.ceil(countdownRemain);
      if (countdownNumEl.textContent !== String(n)) {
        countdownNumEl.textContent = n;
      }
    }
    return;
  }

  timeLeft -= dt;
  const timeUp = timeLeft <= 0;
  if (timeUp) timeLeft = 0;

  if (!spectator && players.length) handlePlayerInput(dt);

  for (const e of entities) {
    if (e.isPlayer && !spectator) continue;
    if (e.type === 'seeker') updateSeekerAI(e, dt);
    else if (e.alive)        updateHiderAI(e, dt);
  }

  for (const e of entities) {
    if (e.type === 'hider' && !e.alive) continue;
    if (e.isPlayer && spectator) { e._px = e.x; e._py = e.y; continue; }

    const moved = Math.hypot(e.x - e._px, e.y - e._py);
    e._px = e.x; e._py = e.y;
    if (moved > 0.15) {
      e.soundTimer -= dt;
      if (e.soundTimer <= 0) {
        if (e.isPlayer) stats.playerSoundCount++;
        emitSound(e);
        e.soundTimer = SOUND_INTERVAL;
      }
    } else {
      e.soundTimer = 0;
    }
  }

  for (let i = soundWaves.length - 1; i >= 0; i--) {
    soundWaves[i].age += dt;
    if (soundWaves[i].age * SOUND_SPEED >= soundWaves[i].maxRadius) soundWaves.splice(i, 1);
  }

  // 抓捕
  for (const h of hiders) {
    if (!h.alive) continue;
    for (const s of seekers) {
      if (Math.hypot(s.x - h.x, s.y - h.y) < s.r + h.r + 2) {
        h.alive = false;
        stats.hidersCaught++;
        if (h.isPlayer && !spectator) {
          const aliveHumanHiders = players.filter(p => p.type === 'hider' && p.alive).length;
          if (aliveHumanHiders === 0) spectator = true;
          showToast(aliveHumanHiders === 0 ? '你们都被抓住了！' : '一名玩家被抓住了！');
        }
        break;
      }
    }
  }

  let aliveCount = 0;
  for (const h of hiders) if (h.alive) aliveCount++;
  stats.hidersAlive = aliveCount;

  if (aliveCount === 0) {
    if (!pendingGameEnd) {
      const grace = spectator ? SPECTATOR_GRACE : 0;
      pendingGameEnd = { winner: 'seeker', at: nowSec() + grace };
    }
  } else if (timeUp) {
    endGame('hiders');
    return;
  }

  if (pendingGameEnd && nowSec() >= pendingGameEnd.at) {
    const w = pendingGameEnd.winner;
    pendingGameEnd = null;
    endGame(w);
    return;
  }
}

/* ============================================================
   渲染
============================================================ */
function drawSpectatorMap() {
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const px = x * TILE, py = y * TILE;
      if (grid[y][x] === 1) {
        ctx.fillStyle = 'rgba(34, 48, 72, 0.85)';
        ctx.fillRect(px, py, TILE, TILE);
        ctx.strokeStyle = 'rgba(90, 140, 220, 0.3)';
        ctx.lineWidth = 1;
        ctx.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);
      } else {
        ctx.fillStyle = 'rgba(10, 16, 26, 0.55)';
        ctx.fillRect(px, py, TILE, TILE);
      }
    }
  }
}

function drawWallMemories() {
  if (!player) return;
  const playerId = player.id;
  const nowT = visualNowSec();
  const totalLife = WALL_MEMORY_HOLD + WALL_MEMORY_FADE;

  for (const [key, wm] of wallMemoryMap) {
    if (wm.emitterId !== playerId) continue;

    wm.arrivals = wm.arrivals.filter(t => nowT - t < totalLife);
    if (wm.arrivals.length === 0) { wallMemoryMap.delete(key); continue; }

    let latestPast = -Infinity;
    for (const t of wm.arrivals) {
      if (t <= nowT && t > latestPast) latestPast = t;
    }
    if (latestPast === -Infinity) continue;

    const age = nowT - latestPast;
    let alpha;
    if (age < WALL_MEMORY_HOLD) alpha = wm.strength * 0.55;
    else alpha = wm.strength * 0.55 * (1 - (age - WALL_MEMORY_HOLD) / WALL_MEMORY_FADE);
    if (alpha <= 0) continue;

    const px = wm.gx * TILE, py = wm.gy * TILE;
    ctx.fillStyle = `rgba(70, 130, 200, ${alpha * 0.9})`;
    ctx.fillRect(px, py, TILE, TILE);
    ctx.strokeStyle = `rgba(150, 220, 255, ${alpha * 1.3})`;
    ctx.lineWidth = 1.2;
    ctx.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);
  }
}

function flashIntensity(t, fadeTime) {
  if (t < 0) return 0;
  if (t >= fadeTime) return 0;
  if (t < DETECT_RISE_TIME) return t / DETECT_RISE_TIME;
  return Math.max(0, 1 - (t - DETECT_RISE_TIME) / (fadeTime - DETECT_RISE_TIME));
}

function renderDetectFlashes() {
  if (!player) return;
  const nowT = visualNowSec();
  const preserveFinal = state === 'over';

  for (const wave of soundWaves) {
    if (!wave.hits || wave.hits.length === 0) continue;
    if (!wave.emitter) continue;

    const frontDist = wave.age * SOUND_SPEED;

    for (const hit of wave.hits) {
      const emitter = wave.emitter;
      const target = hit.target;
      if (!preserveFinal && emitter !== player && target !== player) continue;

      let fx, fy;
      if (target === player || (preserveFinal && emitter !== player)) { fx = target.x; fy = target.y; }
      else { fx = emitter.x; fy = emitter.y; }

      if (!preserveFinal && target && target.type === 'hider' && !target.alive) continue;
      if (!preserveFinal && emitter.type === 'hider' && !emitter.alive) continue;

      if (frontDist < hit.dist) continue;
      const sinceArrival = (frontDist - hit.dist) / SOUND_SPEED;
      if (sinceArrival < 0 || sinceArrival > DETECT_FADE_TIME) continue;

      const intensity = flashIntensity(sinceArrival, DETECT_FADE_TIME);
      if (intensity <= 0) continue;
      const alpha = intensity * 0.95;

      ctx.save();
      ctx.shadowColor = `rgba(255, 130, 60, ${alpha})`;
      ctx.shadowBlur = 20 + intensity * 16;

      const outerR = 16 - intensity * 5;
      ctx.beginPath();
      ctx.arc(fx, fy, outerR, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 110, 45, ${alpha * 0.55})`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(fx, fy, 4 + intensity * 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 235, 195, ${alpha})`;
      ctx.fill();

      ctx.strokeStyle = `rgba(255, 200, 140, ${alpha})`;
      ctx.lineWidth = 2;
      const arm = 12 + intensity * 4;
      ctx.beginPath();
      ctx.moveTo(fx - arm, fy); ctx.lineTo(fx - 4, fy);
      ctx.moveTo(fx + 4, fy);   ctx.lineTo(fx + arm, fy);
      ctx.moveTo(fx, fy - arm); ctx.lineTo(fx, fy - 4);
      ctx.moveTo(fx, fy + 4);   ctx.lineTo(fx, fy + arm);
      ctx.stroke();
      ctx.restore();
    }
  }
}

function render() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  if (state === 'menu') return;

  const nowT = visualNowSec();
  const inGame = (state === 'playing' || state === 'countdown');
  const showEffects = inGame || state === 'over';

  // 结算时或观战时显示上帝视角地图
  const showFullMap = spectator || state === 'over';

  if (showFullMap) {
    ctx.save();
    // 结算时地图更透一些，避免盖住结算面板文字
    if (state === 'over') ctx.globalAlpha = 0.55;
    drawSpectatorMap();
    ctx.restore();
  }

  // 墙壁记忆只在游戏中显示
  if (showEffects) drawWallMemories();

  // 声波射线：游戏结束后也保留终局瞬间的所有声波，不再继续推进。
  if (showEffects) {
    for (const wave of soundWaves) {
      let visible = true;
      if (state !== 'over' && !spectator && player) {
        if (player.type === 'seeker') {
          visible = wave.emitter && wave.emitter.type === 'seeker';
        } else if (player.type === 'hider') {
          visible = wave.emitter && wave.emitter.type === 'hider';
        }
      }
      if (!visible) continue;

      const frontDist = wave.age * SOUND_SPEED;
      const t = frontDist / wave.maxRadius;
      const alpha = Math.max(0.10, 0.9 * (1 - t * 0.85));
      const isBig = wave.strength >= 1.0;

      ctx.strokeStyle = `rgba(140, 220, 255, ${alpha})`;
      ctx.lineWidth = isBig ? 2.0 : 1.2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.beginPath();
      for (const path of wave.rays) {
        if (path.length < 2) continue;
        ctx.moveTo(path[0].x, path[0].y);
        for (let j = 1; j < path.length; j++) {
          const p = path[j];
          if (p.dist <= frontDist) ctx.lineTo(p.x, p.y);
          else {
            const prev = path[j - 1];
            const segLen = p.dist - prev.dist;
            if (segLen > 0.001) {
              const tt = (frontDist - prev.dist) / segLen;
              ctx.lineTo(prev.x + (p.x - prev.x) * tt, prev.y + (p.y - prev.y) * tt);
            }
            break;
          }
        }
      }
      ctx.stroke();
    }

    renderDetectFlashes();
  }

  // 角色
  if (showFullMap) {
    // 结算 / 观战：所有角色
    for (const h of hiders) {
      if (!h.alive) {
        // 被抓的躲藏者：灰色 X
        ctx.save();
        ctx.globalAlpha = state === 'over' ? 0.35 : 0.45;
        ctx.strokeStyle = '#5a6a8c';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(h.x - 5, h.y - 5); ctx.lineTo(h.x + 5, h.y + 5);
        ctx.moveTo(h.x + 5, h.y - 5); ctx.lineTo(h.x - 5, h.y + 5);
        ctx.stroke();
        ctx.restore();
        continue;
      }
      ctx.beginPath();
      ctx.arc(h.x, h.y, h.r + 1.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(60, 220, 150, 0.85)';
      ctx.fill();
    }
    for (const s of seekers) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r + 1.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 80, 110, 0.9)';
      ctx.fill();
    }
  } else if (players.length) {
    for (let i = 0; i < players.length; i++) {
      const p = players[i];
      if (p.type === 'hider' && !p.alive) continue;
      const pulse = 0.5 + 0.5 * Math.sin(nowT * PLAYER_MARKER_PULSE_SPEED + i * Math.PI);
      const outerR = 13 + pulse * 6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, outerR, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(120, 220, 255, ${0.45 + pulse * 0.4})`;
      ctx.lineWidth = 2.2;
      ctx.stroke();

      const innerR = 7 + pulse * 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, innerR, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(160, 230, 255, ${0.55 + pulse * 0.3})`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${0.85 + pulse * 0.15})`;
      ctx.fill();

      if (cfgPlayerCount === 2) {
        ctx.font = '700 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(220,235,255,.85)';
        ctx.fillText(i === 0 ? 'P1' : 'P2', p.x, p.y - 18);
      }
    }
  }

}

/* ============================================================
   HUD
============================================================ */
function updateHUD() {
  timeEl.textContent = fmtTime(timeLeft);
  timeEl.classList.toggle('warn', timeLeft < 20 && (state === 'playing' || state === 'countdown'));

  let alive = 0;
  for (const h of hiders) if (h.alive) alive++;
  aliveEl.textContent = hiders.length ? alive : cfgHiderCount;

  roleEl.textContent = player ? (player.type === 'seeker' ? '🔴 搜捕者' : '🟢 躲藏者') + (cfgPlayerCount === 2 ? ' · 双人' : '') : '—';
  specEl.classList.toggle('show', (spectator || state === 'over') && state !== 'menu');

  if ((state === 'playing' || state === 'countdown') && player && player.isPlayer && !spectator) {
    noiseMeterEl.style.visibility = 'visible';
    const cd = Math.max(0, (player.noiseCooldownUntil || 0) - visualNowSec());
    const ratio = cd <= 0 ? 1 : 1 - cd / NOISE_COOLDOWN;
    noiseFillEl.style.width = (ratio * 100).toFixed(1) + '%';
    noiseMeterEl.classList.toggle('ready', cd <= 0);
    noiseMeterEl.classList.toggle('cooling', cd > 0);
  } else {
    noiseMeterEl.style.visibility = 'hidden';
  }
}

let toastTimer = null;
function showToast(text, duration = 1600) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
}

/* ============================================================
   暂停
============================================================ */
function setPaused(p) {
  if (p === paused) return;
  if (p) {
    paused = true;
    pauseStartMs = performance.now();
    pauseEl.classList.add('show');
  } else {
    paused = false;
    totalPausedMs += performance.now() - pauseStartMs;
    pauseEl.classList.remove('show');
  }
}

    <p class="sub">${selectedRole === 'seeker' ? '🔴 搜捕者' : '🟢 躲藏者'}</p>

    <div class="setting-group">
      <div class="setting-label"><span>本地玩家</span><span class="val" id="valPlayers">${cfgPlayerCount}P</span></div>
      <div class="option-row" id="optPlayers">
        <button data-val="1" class="${cfgPlayerCount===1?'active':''}">单人</button>
        <button data-val="2" class="${cfgPlayerCount===2?'active':''}">双人</button>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-label"><span>追捕者数量</span><span class="val" id="valSeekers">${cfgSeekerCount}</span></div>
      <div class="option-row" id="optSeekers">
        ${[1,2,3].map(n => `<button data-val="${n}" class="${cfgSeekerCount===n?'active':''}">${n}</button>`).join('')}
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-label"><span>躲藏者数量</span><span class="val" id="valHiders">${cfgHiderCount}</span></div>
      <div class="option-row" id="optHiders">
        ${[3,5,6,8,10].map(n => `<button data-val="${n}" class="${cfgHiderCount===n?'active':''}">${n}</button>`).join('')}
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-label"><span>地图大小</span><span class="val" id="valMap">${{small:'小',medium:'中',large:'大'}[cfgMapSize]}</span></div>
      <div class="option-row" id="optMap">
        <button data-val="small"  class="${cfgMapSize==='small' ?'active':''}">小</button>
        <button data-val="medium" class="${cfgMapSize==='medium'?'active':''}">中</button>
        <button data-val="large"  class="${cfgMapSize==='large' ?'active':''}">大</button>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-label"><span>游戏时长</span><span class="val" id="valTime">${fmtTime(cfgGameTime)}</span></div>
      <div class="option-row" id="optTime" style="flex-wrap: wrap;">
        ${timeOptions.map(o => `<button data-val="${o.v}" class="${cfgGameTime===o.v?'active':''}" style="min-width: 60px;">${o.label}</button>`).join('')}
      </div>
    </div>

    <button class="btn again" id="startBtn" style="margin-top:14px">开 始 游 戏</button>
    <button class="btn secondary" id="backBtn">返回</button>
    <p class="hint" style="margin-top:10px">双人模式：两名玩家必须属于同一阵营。P1：WASD / Shift / Space；P2：方向键 / Enter。</p>
  `;

  const updateValLabels = () => {
    panel.querySelector('#valPlayers').textContent = `${cfgPlayerCount}P`;
    panel.querySelector('#valSeekers').textContent = cfgSeekerCount;
    panel.querySelector('#valHiders').textContent = cfgHiderCount;
    panel.querySelector('#valMap').textContent = {small:'小',medium:'中',large:'大'}[cfgMapSize];
    panel.querySelector('#valTime').textContent = fmtTime(cfgGameTime);
  };

  const syncModeCounts = () => {
    const minForPlayers = cfgPlayerCount === 2 ? 2 : 1;
    if (selectedRole === 'seeker') cfgSeekerCount = Math.max(minForPlayers, cfgSeekerCount);
    else cfgHiderCount = Math.max(minForPlayers, cfgHiderCount);
    panel.querySelectorAll('#optSeekers button').forEach(b => b.classList.toggle('active', parseInt(b.dataset.val) === cfgSeekerCount));
    panel.querySelectorAll('#optHiders button').forEach(b => b.classList.toggle('active', parseInt(b.dataset.val) === cfgHiderCount));
  };

  const bindRow = (row, apply) => {
    row.addEventListener('click', ev => {
      const btn = ev.target.closest('button[data-val]');
      if (!btn) return;
      apply(btn.dataset.val);
      syncModeCounts();
      row.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn || (row.id === 'optPlayers' && parseInt(b.dataset.val) === cfgPlayerCount)));
      updateValLabels();
    });
  };

  bindRow(panel.querySelector('#optPlayers'), v => cfgPlayerCount = parseInt(v));
  bindRow(panel.querySelector('#optSeekers'), v => cfgSeekerCount = parseInt(v));
  bindRow(panel.querySelector('#optHiders'),  v => cfgHiderCount  = parseInt(v));
  bindRow(panel.querySelector('#optMap'),     v => cfgMapSize     = v);
  bindRow(panel.querySelector('#optTime'),    v => cfgGameTime    = parseInt(v));
  syncModeCounts();
  updateValLabels();

  panel.querySelector('#startBtn').addEventListener('click', () => startGame(selectedRole));
  panel.querySelector('#backBtn').addEventListener('click', showMenu);
}

function startGame(role) {
  if (cfgPlayerCount === 2) {
    if (role === 'seeker') cfgSeekerCount = Math.max(2, cfgSeekerCount);
    else cfgHiderCount = Math.max(2, cfgHiderCount);
  }
  const preset = MAP_PRESETS[cfgMapSize] || MAP_PRESETS.medium;
  TILE = preset.TILE;
  COLS = preset.COLS;
  ROWS = preset.ROWS;
  WALL_COUNT = preset.walls;
  SOUND_SPEED = SOUND_SPEED_TILES * TILE;

  grid = generateMap();
  openCells = null;
  buildEntities(role);
  soundWaves = [];
  wallMemoryMap = new Map();
  pendingGameEnd = null;
  timeLeft = cfgGameTime;
  spectator = false;
  showGodView = false;
  frozenRenderTime = null;
  paused = false;
  totalPausedMs = 0;
  pauseStartMs = 0;
  pauseEl.classList.remove('show');
  overlay.classList.add('hidden');
  overlay.classList.remove('result');
  overlay.classList.remove('minimized');
  toastEl.classList.remove('show');

  // 重置统计
  stats = {
    playerSoundCount: 0,
    playerNoiseCount: 0,
    playerDetectedEnemy: 0,
    playerDetectedByEnemy: 0,
    hidersCaught: 0,
    hidersAlive: cfgHiderCount,
    totalHiders: cfgHiderCount,
    totalSeekers: cfgSeekerCount,
    gameTimeTotal: cfgGameTime,
    playerRole: role
  };

  // 进入倒计时
  state = 'countdown';
  countdownRemain = START_COUNTDOWN;
  countdownNumEl.textContent = Math.ceil(countdownRemain);

  const seekerMsg = cfgSeekerCount === 1 ? '1 名搜捕者' : `${cfgSeekerCount} 名搜捕者`;
  const hiderMsg = `${cfgHiderCount} 名躲藏者`;
  const mapMsg = {small:'小地图', medium:'中地图', large:'大地图'}[cfgMapSize];
  const msg = role === 'seeker'
    ? `找出所有躲藏者！(${seekerMsg} · ${hiderMsg} · ${mapMsg})`
    : `藏好，别被抓到！(${seekerMsg} · ${hiderMsg} · ${mapMsg})`;
  countdownMsgEl.textContent = msg;

  countdownEl.classList.add('show');
}

function endGame(winner) {
  if (state === 'over') return;
  state = 'over';
  frozenRenderTime = nowSec();
  pendingGameEnd = null;
  showGodView = true;

  if (paused) { paused = false; pauseEl.classList.remove('show'); }
  countdownEl.classList.remove('show');

  const playerRole = player ? player.type : 'hider';
  const playerWon =
    (playerRole === 'seeker' && winner === 'seeker') ||
    (playerRole === 'hider'  && winner === 'hiders');

  let title, desc;
  if (winner === 'seeker') {
    title = playerRole === 'seeker' ? '🎉 你赢了！' : '💀 搜捕者获胜';
    desc  = '所有躲藏者都被抓住了';
  } else {
    title = playerRole === 'hider' ? '🎉 躲藏者胜利！' : '⏰ 时间到';
    desc  = '时间耗尽，仍有躲藏者没被找到';
  }
  if (playerRole === 'hider' && player && !player.alive) {
    title = winner === 'hiders' ? '😅 你被抓了，但队友赢了' : '💀 你被抓住了';
    desc  = winner === 'hiders' ? '时间耗尽，其他躲藏者成功逃脱' : '搜捕者抓住了所有躲藏者';
  }

  // 统计数据
  const playerAlive = player && player.alive;
  const survivedCount = stats.hidersAlive;

  const rows = [
    { key: '游戏时长', val: fmtTime(stats.gameTimeTotal), cls: '' },
    { key: '玩家模式', val: cfgPlayerCount === 2 ? '双人同阵营' : '单人', cls: '' },
    { key: '追捕者 / 躲藏者', val: `${stats.totalSeekers} / ${stats.totalHiders}`, cls: '' },
    { key: '你的身份', val: playerRole === 'seeker' ? '🔴 搜捕者' : '🟢 躲藏者', cls: '' },
    { key: '你的状态', val: playerAlive ? '存活' : '被抓', cls: playerAlive ? 'good' : 'bad' },
    { key: '躲藏者被抓', val: `${stats.hidersCaught} / ${stats.totalHiders}`, cls: 'bad' },
    { key: '躲藏者存活', val: `${survivedCount} / ${stats.totalHiders}`, cls: 'good' },
    { key: '你发声音波次数', val: `${stats.playerSoundCount}`, cls: '' },
    { key: '你使用噪声次数', val: `${stats.playerNoiseCount}`, cls: '' }
  ];

  if (playerRole === 'seeker') {
    rows.push({ key: '你探测到躲藏者', val: `${stats.playerDetectedEnemy} 次`, cls: 'good' });
  } else {
    rows.push({ key: '你被追捕者探测', val: `${stats.playerDetectedByEnemy} 次`, cls: stats.playerDetectedByEnemy > 0 ? 'bad' : 'good' });
  }

  if (cfgPlayerCount === 2) {
    rows.push({ key: '玩家1状态', val: (players[0] && (players[0].type === 'seeker' || players[0].alive)) ? '存活' : '被抓', cls: players[0] && (players[0].type === 'seeker' || players[0].alive) ? 'good' : 'bad' });
    rows.push({ key: '玩家2状态', val: (players[1] && (players[1].type === 'seeker' || players[1].alive)) ? '存活' : '被抓', cls: players[1] && (players[1].type === 'seeker' || players[1].alive) ? 'good' : 'bad' });
  }

  const color = playerWon ? '#7fffc4' : '#ff8fa3';
  panel.innerHTML = `
    <h1 style="background:linear-gradient(120deg,${color},#a98bff);-webkit-background-clip:text;background-clip:text;color:transparent;font-size: clamp(20px,3.2vw,34px);">${title}</h1>
    <p class="sub">${desc}</p>
    <div class="result-stats">
      ${rows.map(r => `
        <div class="stat-row">
          <span class="stat-key">${r.key}</span>
          <span class="stat-val ${r.cls}">${r.val}</span>
        </div>
      `).join('')}
    </div>
    <button class="btn again" id="againBtn">再来一局</button>
    <button class="btn secondary" id="menuBtn">返回菜单</button>
  `;
  overlay.classList.remove('hidden');
  overlay.classList.remove('minimized');
  overlay.classList.add('result');
  resultMinBtn.textContent = '— 收起结算';
  document.getElementById('againBtn').addEventListener('click', () => startGame(selectedRole));
  document.getElementById('menuBtn').addEventListener('click', showMenu);
}

/* ============================================================
   输入事件
============================================================ */
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;

  if (e.key === 'Escape' || e.key === 'Esc') {
    e.preventDefault();
    if (state === 'playing') setPaused(!paused);
    return;
  }

  if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright','enter'].includes(k)) {
    e.preventDefault();
  }

  if (k === 'r' && state !== 'menu') showMenu();
  if (k === 'shift') e.preventDefault();

  if ((e.code === 'Space' || e.key === ' ') && !e.repeat) {
    e.preventDefault();
    const p1 = players[0];
    if (state === 'playing' && !spectator && !paused && p1 && p1.isPlayer) {
      tryEmitNoise(p1);
    }
  }

  if (k === 'enter' && !e.repeat) {
    e.preventDefault();
    const p2 = players[1];
    if (state === 'playing' && !spectator && !paused && p2 && p2.isPlayer) {
      tryEmitNoise(p2);
    }
  }
});

window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
});

/* ============================================================
   结算界面 / 暂停菜单按钮
============================================================ */
resultMinBtn.addEventListener('click', () => {
  if (state !== 'over') return;
  const minimized = overlay.classList.toggle('minimized');
  resultMinBtn.textContent = minimized ? '+ 显示结算' : '— 收起结算';
});

document.getElementById('pauseRestart').addEventListener('click', () => {
  setPaused(false);
  startGame(selectedRole);
});

document.getElementById('pauseMenu').addEventListener('click', () => {
  setPaused(false);
  showMenu();
});

/* ============================================================
   主循环
============================================================ */
function loop(now) {
  requestAnimationFrame(loop);
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  dt = Math.min(dt, 0.05);

  if ((state === 'playing' || state === 'countdown') && !paused) update(dt);

  render();
  updateHUD();
}

showMenu();
requestAnimationFrame(loop);

})();
</script>
</body>
