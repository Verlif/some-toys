<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#327f37">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="西米的农场">
  <title>🌾 西米的农场</title>
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.json">

  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/components.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/animations.css">
</head>
<body>

<!-- 启动等待画面：开库、读档、补算邻居近况都可能要一两秒。
     直接写在 HTML 里，JS 还没跑起来时它就已经可见，不会白屏。 -->
<div id="boot">
  <div class="boot-card">
    <div class="boot-logo">🌾</div>
    <div class="boot-title" id="bootTitle">正在连接到农场</div>
    <div class="boot-sub" id="bootSub">打开本地存档…</div>
    <div class="boot-bar"><i id="bootBar"></i></div>
  </div>
</div>

<div class="app">
  <header class="hud">
    <button class="hud-bar" id="hudToggle" aria-expanded="false">
      <span class="hud-user">
        <span class="avatar">🧑‍🌾</span>
        <span class="hud-id">
          <span class="hud-name" id="nameText">农场主</span>
          <span class="hud-lv">Lv.<span id="lvText">1</span> · <span id="titleText">新手农夫</span></span>
        </span>
      </span>
      <span class="hud-coins">💰 <span id="coinText">0</span></span>
      <span class="hud-caret">▾</span>
    </button>

    <!-- 展开层：绝对定位，不会把下面的土地区域挤走 -->
    <div class="hud-detail" id="hudDetail" hidden>
      <!-- 农场等级与经验进度：这一块是展开后最先要看到的信息 -->
      <div class="hud-level">
        <div class="hud-level-row">
          <span class="hud-level-badge">Lv.<b id="dLevel">1</b></span>
          <span class="hud-level-title" id="dTitle">新手农夫</span>
          <span class="hud-level-exp" id="dExp">0 / 5400</span>
        </div>
        <div class="hud-level-bar"><i id="dExpBar"></i></div>
      </div>
      <div class="hud-detail-grid">
        <div class="hud-cell"><span class="k">距离下一称号</span><span class="v" id="dNextTitle">田间好手</span></div>
        <div class="hud-cell"><span class="k">地块</span><span class="v" id="dPlots">6 / 40</span></div>
        <div class="hud-cell"><span class="k">连续签到</span><span class="v" id="dStreak">0 天</span></div>
        <div class="hud-cell"><span class="k">图鉴收集</span><span class="v" id="dCodex">0 / 200</span></div>
        <div class="hud-cell wide"><span class="k">当前土地</span><span class="v" id="dSoil">普通 ×6</span></div>
      </div>
      <div class="hud-detail-tip">轻点顶栏收起</div>
    </div>
  </header>

  <main>
    <section id="page-farm" class="page active">
      <!-- 顶部操作条：守护犬 + 农场日志 + 一键照料。
           在土地列表之上、跟着列表一起滚走 —— 不再浮在底部压住最后一排地块 -->
      <div class="farm-bar">
        <div class="farm-bar-row">
          <div class="farm-bar-dog" id="farmTools"></div>
          <!-- 农场通知：邻居送礼 / 排行榜奖励都寄到这里，点开手动收下 -->
          <button class="farm-log farm-notice" id="noticeBtn" aria-label="农场通知" title="农场通知">
            📬<i class="fn-badge" id="noticeBadge" hidden>0</i>
          </button>
          <button class="farm-log" id="logBtn" aria-label="农场日志" title="农场日志">📔</button>
        </div>
        <div class="farm-actions" id="farmActions" hidden></div>
        <!-- 自动机器时效条（第 51 轮）：只有买了机器才出现 -->
        <div class="farm-auto" id="farmAuto" hidden></div>
      </div>
      <div class="grid" id="plots"></div>
    </section>
    <section id="page-friends" class="page">
      <div id="friends">
        <!-- 顶部一行是静态结构：搜索框不参与列表重绘，
             否则中文输入法拼拼音时重建元素会打断候选 -->
        <div class="friend-top">
          <div class="section-title">👥 我的好友<i class="sec-count" id="friendCount">0</i></div>
          <label class="friend-search">
            <span class="friend-search-icon">🔍</span>
            <input id="friendSearch" type="text" placeholder="搜名字" autocomplete="off"
                   aria-label="搜索好友名字">
            <button class="friend-search-clear" data-action="clear-search"
                    aria-label="清空搜索" hidden>✕</button>
          </label>
        </div>
        <div id="friendsBody"></div>
      </div>
    </section>
    <section id="page-center" class="page"><div id="center"></div></section>
    <section id="page-shop" class="page"><div id="shop"></div></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-page="farm" class="active"><span>🌱</span>农场</button>
    <button data-page="friends"><span>👥</span>好友</button>
    <button data-village hidden><span>🏘</span>村镇</button>
    <button data-page="center"><span>🏡</span>村中心</button>
    <button data-page="shop"><span>🏪</span>商店</button>
    <button data-sheet><span>☰</span>其他</button>
  </nav>
</div>

<!-- 村镇浮窗：进村后才出现，从底部导航中间的「村镇」按钮打开。
     与「更多功能」「农场日志」共用同一套通用底部浮窗（上滑进场 + 下拉关闭） -->
<div id="villageSheet">
  <div class="sheet-mask" data-close-village></div>
  <div class="sheet-panel">
    <div class="sheet-handle"></div>
    <div class="village-head" data-action="village-toggle" role="button" tabindex="0">
      <span class="vh-icon">🏘</span>
      <span class="vh-title" data-role="village-title">村镇</span>
      <span class="vh-me" data-role="village-me"></span>
      <span class="vh-caret" data-role="village-caret">⌄</span>
    </div>
    <div class="village-status" data-role="village-status"></div>
    <div class="village-more" data-role="village-more" hidden></div>
    <div class="village-online" data-role="village-online"></div>
  </div>
</div>

<!-- 底部浮窗：更多功能 -->
<div id="sheet">
  <div class="sheet-mask" data-close-sheet></div>
  <div class="sheet-panel">
    <div class="sheet-handle"></div>
    <div class="sheet-title">更多功能</div>
    <div class="sheet-grid" id="sheetGrid"></div>
  </div>
</div>

<!-- 农场日志浮窗：与「更多功能」共用一套底部上滑 + 下拉关闭 -->
<div id="logSheet">
  <div class="sheet-mask" data-close-log></div>
  <div class="sheet-panel log-panel">
    <div class="sheet-handle"></div>
    <div class="log-head">
      <div class="log-title">📔 农场日志</div>
      <div class="log-sub">最近 7 天</div>
    </div>
    <div class="log-body" id="logBody"></div>
    <!-- 切换标签放在面板底部：日志内容向上顶，tab 不挡内容也不跟内容滚走 -->
    <div class="log-tabs">
      <button class="filter-chip active" data-log-tab="mine">我的操作</button>
      <button class="filter-chip" data-log-tab="npc">邻居动向</button>
    </div>
  </div>
</div>

<!-- 子页面（底部上滑的全屏面板） -->
<div id="subpage">
  <div class="sheet-handle"></div>
  <div class="subpage-head">
    <h3 id="subpageTitle">功能</h3>
    <div class="sub-coins">💰 <span id="subCoins">0</span></div>
    <button class="close" id="subBack" aria-label="关闭">✕</button>
  </div>
  <div class="subpage-body" id="subpageBody"></div>
  <!-- 底栏：固定在底部，不随内容滚动 -->
  <div class="subpage-foot" id="subpageFoot" hidden></div>
</div>

<!-- 冒险：全屏的卡牌选择界面。
     层级放在子页面之下，这样「退出确认」的模态弹窗才能盖在它上面 -->
<div id="adventure" aria-hidden="true">
  <div class="adv-top">
    <button class="adv-exit" id="advExit" aria-label="退出冒险">✕</button>
    <div class="adv-head">
      <div class="adv-title" id="advTitle">藏宝图</div>
      <div class="adv-steps" id="advSteps">剩余 0 步</div>
    </div>
  </div>
  <div class="adv-bar"><i id="advBar"></i></div>
  <div class="adv-stage" id="advStage">
    <!-- 左右选项放在舞台层而不是卡片里：卡片飞出去时它们仍固定在屏幕两侧 -->
    <div class="adv-side adv-side-left" id="advLeft"></div>
    <div class="adv-side adv-side-right" id="advRight"></div>
    <div class="adv-card" id="advCard">
      <div class="adv-scene" id="advScene">🌲</div>
      <div class="adv-card-title" id="advCardTitle"></div>
      <div class="adv-card-text" id="advCardText"></div>
      <div class="adv-card-hint">← 左滑　右滑 →</div>
    </div>
  </div>
  <div class="adv-toast" id="advToast" hidden></div>
  <div class="adv-foot" id="advFoot">每张牌只有一边藏着奖励</div>
</div>

<!-- 模态弹窗（与子页面同一套底部上滑交互） -->
<div id="modal">
  <div class="modal-mask" data-close></div>
  <div class="modal-card"></div>
</div>
<div id="toasts"></div>

<!-- 进入邻居页时的离线结算等待画面 -->
<div id="simOverlay" hidden>
  <div class="sim-card">
    <div class="sim-emoji">🧑‍🌾</div>
    <div class="sim-title">邻居们正在打理农场……</div>
    <div class="sim-bar"><i></i></div>
    <div class="sim-label">0%</div>
    <div class="sim-detail"></div>
  </div>
</div>

<noscript>
  <p style="padding:40px;text-align:center">本游戏需要启用 JavaScript。</p>
</noscript>

<script type="module" src="./src/main.js"></script>
</body>
</html>
