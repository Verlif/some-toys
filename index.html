<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verlif 的导航站</title>
  <link rel="stylesheet" href="assets/nav.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- 尽早应用主题，避免首屏闪烁 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        var theme = saved || (prefersLight ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- 主题切换按钮 -->
  <button id="themeToggle" class="theme-toggle" aria-label="切换主题" title="切换主题">
    <i class="fas fa-sun"></i>
    <i class="fas fa-moon"></i>
  </button>

  <div class="page-wrapper">

    <!-- GitHub 个人信息区 -->
    <header class="profile-section">
      <a href="https://github.com/Verlif" target="_blank" rel="noopener" class="avatar-link">
        <img src="https://avatars.githubusercontent.com/Verlif" alt="Verlif" class="avatar">
      </a>
      <h1 class="username">Verlif</h1>
      <p class="bio">AI 单页面作品集</p>

      <div class="github-stats">
        <a href="https://github.com/Verlif?tab=repositories" target="_blank" rel="noopener" class="stat-item">
          <i class="fas fa-book"></i>
          <span>Repositories</span>
        </a>
        <a href="https://github.com/Verlif?tab=stars" target="_blank" rel="noopener" class="stat-item">
          <i class="fas fa-star"></i>
          <span>Stars</span>
        </a>
        <a href="https://github.com/Verlif?tab=followers" target="_blank" rel="noopener" class="stat-item">
          <i class="fas fa-users"></i>
          <span>Followers</span>
        </a>
      </div>
    </header>

    <!-- 搜索框 -->
    <div class="search-wrapper">
      <i class="fas fa-search search-icon"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="搜索页面..." autocomplete="off">
      <span class="search-count" id="searchCount"></span>
    </div>

    <!-- 内容区 -->
    <main class="cards-container" id="cardsContainer">
      
    <section class="group group-root">
      <div class="cards-grid">
        
    <a href="pages/介绍.html" class="card" target="_blank" rel="noopener">
      <i class="fas fa-file-code card-icon"></i>
      <span class="card-title">someToys - AI 单页面作品导航站</span>
      <span class="card-desc">专为 AI 生成的单页面 HTML 作品设计的自动化导航站，放文件、推送、自动上线。</span>
    </a>
  
      </div>
    </section>
  

    <section class="group">
      <h2 class="group-title">
        <i class="fas fa-file-code"></i>
        <span>picture</span>
        <span class="group-count">1</span>
      </h2>
      <div class="cards-grid">
        
    <a href="pages/picture/图片主题色编辑器.html" class="card" target="_blank" rel="noopener">
      <i class="fas fa-file-code card-icon"></i>
      <span class="card-title">图片主题色替换工具</span>
      
    </a>
  
      </div>
    </section>
  

    <section class="group">
      <h2 class="group-title">
        <i class="fas fa-wrench"></i>
        <span>tools</span>
        <span class="group-count">1</span>
      </h2>
      <div class="cards-grid">
        
    <a href="pages/tools/随机抽奖.html" class="card" target="_blank" rel="noopener">
      <i class="fas fa-file-code card-icon"></i>
      <span class="card-title">随机抽奖</span>
      
    </a>
  
      </div>
    </section>
  
    </main>

    <!-- 无结果提示 -->
    <div class="no-result" id="noResult" style="display:none;">
      <i class="fas fa-inbox"></i>
      <p>没有找到匹配的页面</p>
    </div>

  </div>

  <script>
    // ===== 主题切换 =====
    (function () {
      var toggle = document.getElementById('themeToggle');
      toggle.addEventListener('click', function () {
        var current = document.documentElement.getAttribute('data-theme') || 'dark';
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    })();

    // ===== 搜索过滤 =====
    (function () {
      var searchInput = document.getElementById('searchInput');
      var cardsContainer = document.getElementById('cardsContainer');
      var noResult = document.getElementById('noResult');
      var searchCount = document.getElementById('searchCount');

      searchInput.addEventListener('input', function () {
        var keyword = this.value.trim().toLowerCase();
        var cards = cardsContainer.querySelectorAll('.card');
        var visibleCount = 0;

        cards.forEach(function (card) {
          var title = card.querySelector('.card-title')?.textContent.toLowerCase() || '';
          var desc = card.querySelector('.card-desc')?.textContent.toLowerCase() || '';
          var match = !keyword || title.includes(keyword) || desc.includes(keyword);
          card.classList.toggle('card-hidden', !match);
          if (match) visibleCount++;
        });

        // 隐藏没有可见卡片的分组
        cardsContainer.querySelectorAll('.group').forEach(function (group) {
          var hasVisible = group.querySelector('.card:not(.card-hidden)');
          group.classList.toggle('group-hidden', !hasVisible);
        });

        noResult.style.display = visibleCount === 0 ? 'flex' : 'none';
        searchCount.textContent = keyword ? ('找到 ' + visibleCount + ' 个') : '';
      });
    })();
  </script>

</body>
</html>
